              <span style="display:flex;align-items:center;gap:6px">
                ${p.status==='pausado'? `<span class="badge status" style="background:var(--secondary-tint);color:var(--primary-dark)">⏸ Pausado</span>`:''}
                ${notStarted? `<span class="badge" style="background:var(--urgent);color:#fff;font-weight:700">🚦 Projeto não iniciado</span>`:''}
                <span class="contact-role">${pct}%</span>

    </div>
  `;
}

// Verifica se o nome de um item bate com alguma palavra-chave do plano do dia (ignora acentos).
function itemMatchesPlanKeywords(name, keywords){
  if(!keywords || !keywords.length) return false;
  const norm = (name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  return keywords.some(kw=>{
    const kwNorm = kw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return norm.includes(kwNorm);
  });
}

    const totalStockCount = Object.keys(d.shopping.stock).length;

    body = `
      ${state.formOpen['compras-stock'] ? `

      <div class="field" style="margin-bottom:12px">

      ${stockSearch ? `<div class="contact-role" style="margin:-6px 0 12px">${filteredStockCount} de ${totalStockCount} produto(s) encontrados</div>` : ''}
      ${filteredStockCount===0 ? `<div class="empty">Nenhum produto encontrado para "${escapeHtml(state.stockSearch||'')}".</div>` : ''}
      ${Object.keys(LIST_META).map(cat=>{
        const entries = Object.entries(d.shopping.stock)
          .filter(([name,entry])=> entry.category===cat && matchesSearch([name,entry]))
          .sort((a,b)=>a[0].localeCompare(b[0]));
        if(!entries.length) return '';
        return `<div style="margin-bottom:16px">

            <span class="dot" style="background:${LIST_META[cat].color}"></span>

            <span class="contact-role">${entries.length} itens</span>
          </div>
          ${entries.map(([name,entry])=>{
            const inactive = entry.active===false;

            const needsBuy = !inactive && (Number(entry.qty)||0) <= 0;
            const daysAvailable = (!inactive && entry.availabilitySince) ? daysDiff(todayISO(), entry.availabilitySince) : null;
            const avg = avgStockDuration(entry);
            let forecastText = '';
            if(avg!=null){
              forecastText = `Média: nova compra a cada ~${avg} dia(s)`;
              if(!inactive && entry.availabilitySince){
                const estDate = new Date(entry.availabilitySince+'T00:00:00');
                estDate.setDate(estDate.getDate()+avg);
                forecastText += ` · previsão: ${fmtDate(estDate.toISOString().slice(0,10))}`;

            let expiryColor = 'var(--ink)';
            if(entry.expiryDate){
              const diff = daysDiff(entry.expiryDate, todayISO());
              if(diff<=7) expiryColor = 'var(--urgent)';
            }
            const compareBadge = priceCompareBadge(name);
            return `<div class="stock-card ${inactive?'inactive':''}">
              <div class="stock-card-top">
                <span style="font-size:17px;flex:0 0 auto">${productIcon(name, cat)}</span>

                  <select data-stock-category="${escapeHtml(name)}">

                </div>
                <div class="stock-field">
                  <label>Quantidade</label>
                  <div class="stock-qty-pair">
                    <input type="number" min="0" step="1" value="${entry.qty??0}" data-stock-qty="${escapeHtml(name)}">
                    <input type="text" value="${escapeHtml(entry.unit||'')}" placeholder="un." data-stock-unit="${escapeHtml(name)}">

                  <label>Estoque mín.</label>
                  <input type="number" min="0" step="1" value="${entry.minQty??1}" data-stock-min="${escapeHtml(name)}">
                </div>
                <div class="stock-field">
                  <label>Validade</label>
                  <input type="date" value="${entry.expiryDate||''}" data-stock-expiry="${escapeHtml(name)}" style="color:${expiryColor}">
                </div>
                <div class="stock-field">
                  <label>Local de compra</label>
                  <input type="text" value="${escapeHtml(entry.purchaseLocation||'')}" placeholder="Onde comprar" data-stock-location="${escapeHtml(name)}">
                </div>
                <div class="stock-field">
                  <label>Último preço</label>
                  <input type="number" min="0" step="0.01" value="${priceVal}" placeholder="0,00" data-price="${escapeHtml(name)}">
                </div>
                <div class="stock-field" style="grid-column:1/-1">
                  <label>Descrição / observação</label>
                  <input type="text" value="${escapeHtml(entry.description||'')}" placeholder="Ex: marca preferida, tamanho, detalhes..." data-stock-desc="${escapeHtml(name)}">
                </div>
              </div>
              ${(daysAvailable!=null || forecastText || compareBadge)? `<div class="stock-meta">
                ${daysAvailable!=null? `Disponível há ${daysAvailable}d`:''}${(daysAvailable!=null && forecastText)?' · ':''}${forecastText}
                ${compareBadge}
              </div>`:''}
            </div>`;
          }).join('')}
        </div>`;
      }).join('')}
    `;
  } else if(sub==='historico'){
    const search = (state.historySearch||'').toLowerCase();
    const purchases = d.shopping.purchases
      .filter(p=> !search || p.name.toLowerCase().includes(search))
      .slice().sort((a,b)=> new Date(b.date)-new Date(a.date) || String(b.id).localeCompare(String(a.id)));
    const totalSpent = purchases.reduce((s,p)=>s+(p.price*p.qty),0);
    const byDate = {};
    purchases.forEach(p=>{ (byDate[p.date] = byDate[p.date]||[]).push(p); });
    const dates = Object.keys(byDate).sort((a,b)=> new Date(b)-new Date(a));
    body = `
      <div class="field" style="margin-bottom:12px">
        <label>Buscar produto</label>
        <input type="text" id="history-search" placeholder="Ex: leite" value="${escapeHtml(state.historySearch||'')}">
      </div>
      ${purchases.length? `
        <div class="contact-role" style="margin-bottom:12px">
          ${search? 'Resultado da busca':'Total já gasto'}: <b style="color:var(--ink)">${fmtBRL(totalSpent)}</b> · ${purchases.length} item(ns) concluído(s)
        </div>
        ${dates.map(dt=>`
          <div style="margin-bottom:16px">
            <div class="contact-role" style="font-weight:700;margin-bottom:6px">${fmtDate(dt)}</div>
            ${byDate[dt].map(p=>`
              <div class="row-item" style="flex-wrap:wrap">
                <span style="font-size:17px;flex:0 0 auto">${productIcon(p.name, p.category)}</span>

    body = renderShoppingPlan();
  }

  const grandTotal = Object.values(d.shopping.lists).flat()
    .filter(i=>{ const entry = d.shopping.stock[i.name]; return !(entry && entry.active===false); })
    .reduce((s,i)=>s+((d.shopping.prices[i.name.toLowerCase()]||0)*(i.qty||1)),0);

  return `
    <div class="card" style="margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">

    </div>
    <div class="card">${body}</div>
  `;
}
// ---------- DASHBOARD DE COMPRAS ----------
function renderComprasDashboard(){
  const d = state.data;
  const purchases = d.shopping.purchases || [];
  if(!purchases.length){
    return `<div class="empty">Ainda não há compras registradas. Marque itens como comprados para alimentar o dashboard.</div>`;
  }

  const totalSpent = purchases.reduce((s,p)=>s+(p.price*p.qty),0);
  const totalCount = purchases.length;

  // gasto por mês (YYYY-MM)
  const byMonth = {};
  purchases.forEach(p=>{
    const ym = (p.date||'').slice(0,7);
    byMonth[ym] = (byMonth[ym]||0) + p.price*p.qty;
  });
  const months = Object.keys(byMonth).filter(Boolean).sort((a,b)=>b.localeCompare(a));
  const maxMonth = Math.max(...months.map(m=>byMonth[m]), 0);
  const nowYm = todayISO().slice(0,7);
  const thisMonthTotal = byMonth[nowYm] || 0;
  const monthlyAvg = months.length ? totalSpent/months.length : 0;
  const monthLabel = ym=>{
    const [y,m] = ym.split('-');
    const dt = new Date(Number(y), Number(m)-1, 1);
    return dt.toLocaleDateString('pt-BR',{month:'long', year:'numeric'});
  };

  // gasto por grupo/categoria
  const byCat = {};
  purchases.forEach(p=>{
    const cat = p.category || 'outras';
    byCat[cat] = (byCat[cat]||0) + p.price*p.qty;
  });
  const cats = Object.keys(byCat).sort((a,b)=>byCat[b]-byCat[a]);
  const maxCat = Math.max(...cats.map(c=>byCat[c]), 0);

  // gasto por categoria de produto (automática, calculada a partir do nome — ver CATEGORIA_MAP)
  const byCategoria = {};
  purchases.forEach(p=>{
    const categoria = resolveCategoria(p.name);
    byCategoria[categoria] = (byCategoria[categoria]||0) + p.price*p.qty;
  });
  const categorias = Object.keys(byCategoria).sort((a,b)=>byCategoria[b]-byCategoria[a]);
  const maxCategoria = Math.max(...categorias.map(c=>byCategoria[c]), 0);
  const CATEGORIA_ICON = {
    'Frutas e Legumes':'🥦','Padaria e Doces':'🍞','Frios e Laticínios':'🧀','Bebidas':'🥤',
    'Limpeza e Higiene Pessoal':'🧴','Congelados':'🧊','Utilidades e Outros':'🔧','Mercearia':'🛒','Outros':'📦'
  };

  // ranking dos itens mais caros (total gasto acumulado por produto)
  const byItem = {};
  purchases.forEach(p=>{
    const key = p.name.toLowerCase();
    if(!byItem[key]) byItem[key] = {name:p.name, category:p.category, total:0, qty:0, count:0};
    byItem[key].total += p.price*p.qty;
    byItem[key].qty += (p.qty||0);
    byItem[key].count += 1;
  });
  const ranking = Object.values(byItem).sort((a,b)=>b.total-a.total).slice(0,10);
  const maxRank = ranking.length ? ranking[0].total : 0;

  return `
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:18px">
      <div class="stock-card" style="text-align:center">
        <div class="contact-role">Total gasto</div>
        <div style="font-family:'Sora',sans-serif;font-size:18px;font-weight:700;margin-top:2px">${fmtBRL(totalSpent)}</div>
      </div>
      <div class="stock-card" style="text-align:center">
        <div class="contact-role">Este mês</div>
        <div style="font-family:'Sora',sans-serif;font-size:18px;font-weight:700;margin-top:2px">${fmtBRL(thisMonthTotal)}</div>
      </div>
      <div class="stock-card" style="text-align:center">
        <div class="contact-role">Média mensal</div>
        <div style="font-family:'Sora',sans-serif;font-size:18px;font-weight:700;margin-top:2px">${fmtBRL(monthlyAvg)}</div>
      </div>
      <div class="stock-card" style="text-align:center">
        <div class="contact-role">Itens comprados</div>
        <div style="font-family:'Sora',sans-serif;font-size:18px;font-weight:700;margin-top:2px">${totalCount}</div>
      </div>
    </div>

    <div style="margin:4px 0 10px"><b style="font-size:14px">📅 Gasto por mês</b></div>
    ${months.map(ym=>{
      const val = byMonth[ym];
      const pct = maxMonth ? Math.round(val/maxMonth*100) : 0;
      return `
      <div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
          <span style="text-transform:capitalize">${monthLabel(ym)}</span>
          <b>${fmtBRL(val)}</b>
        </div>
        <div style="background:var(--surface-2);border-radius:6px;height:8px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:var(--primary);border-radius:6px"></div>
        </div>
      </div>`;
    }).join('')}

    <div class="divider"></div>
    <div style="margin:14px 0 10px"><b style="font-size:14px">🗂️ Gasto por grupo</b></div>
    ${cats.map(cat=>{
      const val = byCat[cat];
      const pct = maxCat ? Math.round(val/maxCat*100) : 0;
      const pctOfTotal = totalSpent ? Math.round(val/totalSpent*100) : 0;
      const meta = LIST_META[cat];
      return `
      <div style="margin-bottom:10px">
        <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px;gap:8px">
          <span style="display:flex;align-items:center;gap:6px"><span class="dot" style="background:${meta?meta.color:'var(--ink-faint)'}"></span>${meta?meta.label:cat}</span>
          <b>${fmtBRL(val)} <span class="contact-role">(${pctOfTotal}%)</span></b>
        </div>
        <div style="background:var(--surface-2);border-radius:6px;height:8px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${meta?meta.color:'var(--ink-faint)'};border-radius:6px"></div>

function avgStockDuration(entry){
  if(!entry.durations || !entry.durations.length) return null;
  const sum = entry.durations.reduce((s,d)=>s+d,0);
  return Math.round(sum/entry.durations.length);
}
// Deriva o status (tem/pouco/acabou) automaticamente a partir da quantidade e do estoque mínimo.
function stockStatusFromQty(qty, minQty){
  const q = Number(qty)||0, m = Number(minQty)||0;
  if(q<=0) return 'acabou';
  if(q<=m) return 'pouco';
  return 'tem';
}
// Toda vez que o produto é comprado novamente, registra quantos dias ele ficou disponível
// desde a última compra (para calcular a média e prever a próxima compra).
function recordPurchaseCycle(entry){
  const today = todayISO();
  if(entry.availabilitySince){
    const days = daysDiff(today, entry.availabilitySince);
    if(days>0){
      if(!Array.isArray(entry.durations)) entry.durations = [];
      entry.durations.push(days);
      if(entry.durations.length > 12) entry.durations.shift();
    }
  }
  entry.availabilitySince = today;
}

function occurrencesInMonth(ev, year, month){
  const start = new Date(ev.date+'T00:00:00');
  const first = new Date(year, month, 1);
  const last = new Date(year, month+1, 0);
  const durationDays = ev.endDate ? Math.max(0, Math.round((new Date(ev.endDate+'T00:00:00') - start) / 86400000)) : 0;

  function expandRange(occStart){
    const range = [];
    for(let i=0;i<=durationDays;i++){
      const dd = new Date(occStart); dd.setDate(dd.getDate()+i);
      if(dd>=first && dd<=last) range.push(dd);
    }
    return range;
  }

  const results = [];
  if(!ev.recurring || ev.recurring==='none'){
    const occEnd = new Date(start); occEnd.setDate(occEnd.getDate()+durationDays);
    if(occEnd>=first && start<=last) results.push(...expandRange(start));
    return results;
  }
  if(ev.recurring==='yearly'){
    if(start.getMonth()===month){
      const dd = new Date(year, month, start.getDate());
      if(dd>=start) results.push(...expandRange(dd));
    }
    return results;
  }
  if(ev.recurring==='monthly'){
    const dd = new Date(year, month, Math.min(start.getDate(), last.getDate()));
    if(dd>=first && dd<=last && dd>=start) results.push(...expandRange(dd));
    return results;
  }
  if(ev.recurring==='weekly'){
    let dd = new Date(start);
    while(dd < first) dd.setDate(dd.getDate()+7);
    while(dd <= last){
      if(dd>=start) results.push(...expandRange(dd));
      dd.setDate(dd.getDate()+7);
    }
    return results;
  }
  return results;
}

function googleCalendarUrl(ev, startDateISO){
  const title = encodeURIComponent(ev.title);
  const detailsLines = [];
  if(ev.person) detailsLines.push('Quem: '+ev.person);
  detailsLines.push('Criado no Daily');
  const details = encodeURIComponent(detailsLines.join('\n'));
  let datesParam;
  if(ev.time){
    const [h,m] = ev.time.split(':').map(Number);
    const startDT = startDateISO.replace(/-/g,'') + 'T' + String(h).padStart(2,'0') + String(m).padStart(2,'0') + '00';
    const endBase = ev.endDate || startDateISO;
    const endHour = (h+1) % 24;
    const endDT = endBase.replace(/-/g,'') + 'T' + String(endHour).padStart(2,'0') + String(m).padStart(2,'0') + '00';
    datesParam = `${startDT}/${endDT}`;
  } else {
    const endBase = ev.endDate || startDateISO;
    const endDateObj = new Date(endBase+'T00:00:00');
    endDateObj.setDate(endDateObj.getDate()+1); // fim exclusivo no formato do Google
    const endStr = endDateObj.toISOString().slice(0,10).replace(/-/g,'');
    datesParam = `${startDateISO.replace(/-/g,'')}/${endStr}`;
  }
  let recurParam = '';
  const freqMap = {weekly:'WEEKLY', monthly:'MONTHLY', yearly:'YEARLY'};
  if(ev.recurring && freqMap[ev.recurring]) recurParam = `&recur=RRULE:FREQ=${freqMap[ev.recurring]}`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${datesParam}&details=${details}${recurParam}&ctz=America%2FSao_Paulo`;
}
function icsEscape_(s){
  return (s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
}
// Formato .ics (iCalendar) — padrão universal aceito pelo Calendário do iPhone/Mac,
// Outlook, e qualquer outro app de agenda. Não depende de nenhum serviço externo.
function buildIcsContent(ev, startDateISO){
  const dtstamp = new Date().toISOString().replace(/[-:]/g,'').split('.')[0]+'Z';
  let dtStartLine, dtEndLine;
  if(ev.time){
    const [h,m] = ev.time.split(':').map(Number);
    const startStr = startDateISO.replace(/-/g,'') + 'T' + String(h).padStart(2,'0') + String(m).padStart(2,'0') + '00';
    const endBase = ev.endDate || startDateISO;
    const endHour = (h+1) % 24;
    const endStr = endBase.replace(/-/g,'') + 'T' + String(endHour).padStart(2,'0') + String(m).padStart(2,'0') + '00';
    dtStartLine = `DTSTART:${startStr}`;
    dtEndLine = `DTEND:${endStr}`;
  } else {
    const endBase = ev.endDate || startDateISO;
    const endDateObj = new Date(endBase+'T00:00:00');
    endDateObj.setDate(endDateObj.getDate()+1);
    const endStr = endDateObj.toISOString().slice(0,10).replace(/-/g,'');
    dtStartLine = `DTSTART;VALUE=DATE:${startDateISO.replace(/-/g,'')}`;
    dtEndLine = `DTEND;VALUE=DATE:${endStr}`;
  }
  const descLines = [];
  if(ev.person) descLines.push('Quem: '+ev.person);
  descLines.push('Criado no Daily');
  let rrule = '';
  const freqMap = {weekly:'WEEKLY', monthly:'MONTHLY', yearly:'YEARLY'};
  if(ev.recurring && freqMap[ev.recurring]) rrule = `RRULE:FREQ=${freqMap[ev.recurring]}`;
  const lines = [
    'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Daily//PT-BR','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT',
    `UID:${ev.id}@daily-app`,
    `DTSTAMP:${dtstamp}`,
    dtStartLine,
    dtEndLine,
    `SUMMARY:${icsEscape_(ev.title)}`,
    `DESCRIPTION:${icsEscape_(descLines.join('\n'))}`,
  ];
  if(rrule) lines.push(rrule);
  lines.push('END:VEVENT','END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadIcsForEvent(ev, startDateISO){
  const content = buildIcsContent(ev, startDateISO);
  const blob = new Blob([content], {type:'text/calendar;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (ev.title||'evento').replace(/[^\w\- ]/g,'').trim().slice(0,60) + '.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

function mergeTimeline(p){
  const items = [];
  p.timeline.forEach(t=>items.push({date:t.date, label:t.label, type:'milestone', id:t.id}));
  p.checklist.filter(c=>c.startDate || c.endDate).forEach(c=>items.push({
    date:c.endDate || c.startDate, startDate:c.startDate, endDate:c.endDate,
    label:c.text, type:'checklist', done:c.done, value:c.value, id:c.id
  }));
  return items.sort((a,b)=>new Date(a.date)-new Date(b.date));
}
function renderProjectCalendar(p){
  const items = mergeTimeline(p);
  const year = state.projCalYear, month = state.projCalMonth;
  const first = new Date(year, month, 1);
  const last = new Date(year, month+1, 0);
  const startOffset = first.getDay();
  const dayMap = {}; const startMap = {};
  items.forEach(it=>{ (dayMap[it.date] = dayMap[it.date]||[]).push(it); });
  items.filter(it=>it.type==='checklist' && it.startDate && it.startDate!==it.date)
    .forEach(it=>{ (startMap[it.startDate] = startMap[it.startDate]||[]).push(it); });
  const todayKey = todayISO();
  let cells = '';
  for(let i=0;i<startOffset;i++) cells += `<div></div>`;
  for(let day=1; day<=last.getDate(); day++){
    const dt = new Date(year, month, day);
    const key = isoLocal(dt);
    const evs = dayMap[key] || [];
    const starts = startMap[key] || [];
    const isToday = key===todayKey;
    const isGoal = key===p.deadlineGoal;
    const titleParts = [...evs.map(e=>e.label), ...starts.map(e=>`início: ${e.label}`)];
    cells += `<div style="
        aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
        border-radius:10px; border:1.4px solid ${isGoal?'var(--urgent)':'transparent'};
        background:${isToday?'var(--today-tint)':'var(--surface-2)'}; font-size:12px; font-weight:${isToday?'700':'500'};
      " title="${titleParts.join(', ')}">
      <span>${day}</span>
      ${(evs.length||starts.length)? `<span style="display:flex;gap:2px">${starts.slice(0,2).map(()=>`<span style="width:5px;height:5px;border-radius:50%;border:1.3px solid var(--primary);background:none"></span>`).join('')}${evs.slice(0,3).map(e=>`<span style="width:5px;height:5px;border-radius:50%;background:${e.type==='milestone'?'var(--secondary)':(e.done?'var(--primary)':'var(--urgent)')}"></span>`).join('')}</span>` : (isGoal?`<span style="font-size:8px">🎯</span>`:'')}
    </div>`;
  }
  return `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <button class="icon-btn" data-proj-cal-nav="-1" style="font-size:18px">‹</button>
      <b class="display" style="font-size:15px">${MONTHS_PT[month]} ${year}</b>
      <button class="icon-btn" data-proj-cal-nav="1" style="font-size:18px">›</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px">
      ${WEEKDAYS_PT.map(w=>`<div style="text-align:center;font-size:10.5px;color:var(--ink-faint);font-weight:700">${w}</div>`).join('')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px">${cells}</div>
  `;
}

      ${p.deadlineGoal? `<div class="contact-role" style="margin-top:2px">${daysToDeadline<0? `⚠️ Prazo vencido há ${Math.abs(daysToDeadline)} dia(s)` : daysToDeadline===0? '📅 O prazo é hoje!' : `📅 Faltam ${daysToDeadline} dia(s) para o prazo (${fmtDate(p.deadlineGoal)})`}</div>` : ''}

          const overdue = !it.done && new Date(it.date) < new Date(todayISO());
          const dateLabel = (it.startDate && it.endDate && it.startDate!==it.endDate)
            ? `${fmtDate(it.startDate)} → ${fmtDate(it.endDate)}` : fmtDate(it.date);
          return `<div class="tl-item ${it.done?'done':''} ${overdue?'overdue':''}">
            <span class="tl-dot">${it.type==='milestone'?'📅':(it.done?'✓':'')}</span>
            <div class="tl-date">${dateLabel}</div>
            <div class="tl-label">${escapeHtml(it.label)}${it.value?` · ${fmtBRL(it.value)}`:''}${it.type==='milestone'?' · marco':''}</div>
          </div>`;
        }).join('')}
      </div>` : `<div class="empty">Adicione datas ao checklist ou marcos abaixo para ver a linha do tempo.</div>`}
      <div class="divider"></div>
      <div class="section-title" style="margin-bottom:8px">Adicionar marco manual</div>
      <form class="inline" data-form="add-milestone" data-pid="${p.id}">
        <input name="label" placeholder="Marco (ex: Escolher móveis)" required style="flex:1;min-width:140px">
        <input type="date" name="date" required>
        <button class="btn" type="submit">Adicionar</button>
      </form>
      ${p.timeline.length? p.timeline.slice().sort((a,b)=>new Date(a.date)-new Date(b.date)).map(t=>`
        <div class="row-item"><span>📅</span><span class="item-name">${escapeHtml(t.label)}</span>
          <span class="contact-role">${fmtDate(t.date)}</span>
          <button class="icon-btn" data-del-milestone="${p.id}:${t.id}">✕</button></div>`).join('') : ''}
    </div>

    <div class="card" style="margin-bottom:14px">
      <div class="section-title">Anotações</div>
      <textarea data-notes="${p.id}" placeholder="Escreva ideias, links, medidas...">${escapeHtml(p.notes||'')}</textarea>
    </div>

    <div class="card">
      <div class="section-title">Histórico de atividades</div>
      ${p.activities.length? p.activities.slice().reverse().map(a=>`
        <div class="row-item"><span class="contact-role" style="min-width:70px">${fmtDate(a.date)}</span><span class="item-name">${escapeHtml(a.text)}</span></div>
      `).join('') : `<div class="empty">Nada registrado ainda.</div>`}
      <div class="divider"></div>
      <button class="btn danger small" data-del-project="${p.id}">Excluir projeto</button>
    </div>
  `;
}
function logActivity(p, text){
  p.activities.push({id:uid(), text, date:todayISO()});
}
function autoUpdateStatus(p){
  const total = p.checklist.length;
  const done = p.checklist.filter(c=>c.done).length;
  const pct = total ? (done/total*100) : 0;
  if(total>0 && pct===100){
    if(p.status!=='concluido'){ p.status='concluido'; logActivity(p, `Status alterado automaticamente para ${PROJECT_STATUS.concluido} (100% do checklist)`); }
    return;
  }
  if(p.status==='pausado') return; // respeita a pausa manual enquanto não está 100% concluído
  if(pct>0){
    if(p.status!=='andamento'){ p.status='andamento'; logActivity(p, `Status alterado automaticamente para ${PROJECT_STATUS.andamento} (${Math.round(pct)}% do checklist)`); }
  }
}

      const ev = state.data.agenda.events.find(ev=>ev.id===editingId);
      if(ev){
        ev.title = fd.get('title'); ev.type = fd.get('type'); ev.date = fd.get('date');
        ev.endDate = fd.get('endDate')||null; ev.time = fd.get('time'); ev.person = fd.get('person');
        ev.recurring = fd.get('recurring'); ev.city = cityVal; ev.uf = ufVal; ev.cep = cepVal; ev.place = placeVal;
      }
      state.editingEventId = null;
    } else {
      state.data.agenda.events.push({id:uid(), title:fd.get('title'), type:fd.get('type'), date:fd.get('date'), endDate:fd.get('endDate')||null, time:fd.get('time'), person:fd.get('person'), recurring:fd.get('recurring'), city:cityVal, uf:ufVal, cep:cepVal, place:placeVal});
      state.formOpen.agenda = false;
    }
    await saveKey('agenda'); render();
  });
  root.querySelectorAll('[data-edit-event]').forEach(el=>el.addEventListener('click', ()=>{
    state.editingEventId = el.dataset.editEvent; render();
    const formCard = document.getElementById('event-form-card');
    if(formCard) formCard.scrollIntoView({behavior:'smooth', block:'start'});
  }));
  const cancelEditBtn = root.querySelector('[data-cancel-edit-event]');
  if(cancelEditBtn) cancelEditBtn.addEventListener('click', ()=>{
    state.editingEventId = null; render();
  });
  root.querySelectorAll('[data-del-event]').forEach(el=>el.addEventListener('click', async ()=>{
    state.data.agenda.events = state.data.agenda.events.filter(ev=>ev.id!==el.dataset.delEvent);
    if(state.editingEventId===el.dataset.delEvent) state.editingEventId = null;
    await saveKey('agenda'); render();
  }));
  root.querySelectorAll('[data-agenda-view]').forEach(el=>el.addEventListener('click', ()=>{
    state.agendaView = el.dataset.agendaView; render();
  }));
  root.querySelectorAll('[data-cal-nav]').forEach(el=>el.addEventListener('click', ()=>{
    const delta = parseInt(el.dataset.calNav);
    let m = state.calMonth + delta, y = state.calYear;
    if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
    state.calMonth=m; state.calYear=y; render();
  }));
  const calTodayBtn = root.querySelector('[data-cal-today]');
  if(calTodayBtn) calTodayBtn.addEventListener('click', ()=>{
    const n = new Date();
    state.calYear=n.getFullYear(); state.calMonth=n.getMonth(); state.selectedDate=todayISO(); render();
  });
  root.querySelectorAll('[data-cal-day]').forEach(el=>el.addEventListener('click', ()=>{
    state.selectedDate = state.selectedDate===el.dataset.calDay ? null : el.dataset.calDay;
    render();
  }));
  root.querySelectorAll('[data-goto-casa]').forEach(el=>el.addEventListener('click', ()=> setView('casa')));
  root.querySelectorAll('[data-goto-plano]').forEach(el=>el.addEventListener('click', ()=>{
    state.shopSubtab = 'plano'; setView('compras');
  }));

  // recados
  const addMsgForm = root.querySelector('[data-form="add-message"]');
  if(addMsgForm) addMsgForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    state.data.messages.messages.push({id:uid(), text:fd.get('text'), priority:fd.get('priority'), author:fd.get('author'), done:false, date:todayISO()});
    state.formOpen.recados = false;
    await saveKey('messages'); render();
  });
  root.querySelectorAll('[data-toggle-msg]').forEach(el=>el.addEventListener('click', async ()=>{
    const m = state.data.messages.messages.find(m=>m.id===el.dataset.toggleMsg);
    m.done = !m.done; await saveKey('messages'); render();
  }));
  root.querySelectorAll('[data-del-msg]').forEach(el=>el.addEventListener('click', async ()=>{
    state.data.messages.messages = state.data.messages.messages.filter(m=>m.id!==el.dataset.delMsg);
    await saveKey('messages'); render();
  }));

  // casa
  const addTaskForm = root.querySelector('[data-form="add-task"]');
  if(addTaskForm) addTaskForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const recurring = fd.get('recurring') || 'none';
    const dueDate = fd.get('dueDate') || (recurring!=='none' ? todayISO() : null); // repetição precisa de uma data base
    const editingId = e.target.dataset.editingId;
    if(editingId){
      const t = state.data.home.tasks.find(t=>t.id===editingId);
      if(t){
        t.title = fd.get('title'); t.responsavel = fd.get('responsavel'); t.category = fd.get('category');
        t.dueDate = dueDate; t.recurring = recurring;
      }
      state.editingTaskId = null;
    } else {
      state.data.home.tasks.push({id:uid(), title:fd.get('title'), responsavel:fd.get('responsavel'), category:fd.get('category'), dueDate, done:false, recurring});
      state.formOpen.casa = false;
    }
    await saveKey('home'); render();
  });
  root.querySelectorAll('[data-toggle-task]').forEach(el=>el.addEventListener('click', async ()=>{
    const t = state.data.home.tasks.find(t=>t.id===el.dataset.toggleTask);
    if(t){ t.done = !t.done; await saveKey('home'); render(); }
  }));
  root.querySelectorAll('[data-edit-task]').forEach(el=>el.addEventListener('click', ()=>{
    state.editingTaskId = el.dataset.editTask; render();
  }));
  const cancelEditTaskBtn = root.querySelector('[data-cancel-edit-task]');
  if(cancelEditTaskBtn) cancelEditTaskBtn.addEventListener('click', ()=>{
    state.editingTaskId = null; render();
  });
  root.querySelectorAll('[data-del-task]').forEach(el=>el.addEventListener('click', async ()=>{
    state.data.home.tasks = state.data.home.tasks.filter(t=>t.id!==el.dataset.delTask);
    if(state.editingTaskId===el.dataset.delTask) state.editingTaskId = null;
    await saveKey('home'); render();
  }));

  // contatos
  const addContactForm = root.querySelector('[data-form="add-contact"]');
  if(addContactForm) addContactForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(e.target);
    const editingId = e.target.dataset.editingId;
    if(editingId){
      const c = state.data.contacts.contacts.find(c=>c.id===editingId);
      if(c){
        c.name = fd.get('name'); c.role = fd.get('role'); c.phone = fd.get('phone'); c.notes = fd.get('notes');
      }
      state.editingContactId = null;
    } else {
      state.data.contacts.contacts.push({id:uid(), name:fd.get('name'), role:fd.get('role'), phone:fd.get('phone'), notes:fd.get('notes')});
      state.formOpen.contatos = false;
    }
    await saveKey('contacts'); render();
  });
  root.querySelectorAll('[data-edit-contact]').forEach(el=>el.addEventListener('click', ()=>{
    state.editingContactId = el.dataset.editContact; render();
  }));
  const cancelEditContactBtn = root.querySelector('[data-cancel-edit-contact]');
  if(cancelEditContactBtn) cancelEditContactBtn.addEventListener('click', ()=>{
    state.editingContactId = null; render();
  });
  root.querySelectorAll('[data-del-contact]').forEach(el=>el.addEventListener('click', async ()=>{
    state.data.contacts.contacts = state.data.contacts.contacts.filter(c=>c.id!==el.dataset.delContact);
    if(state.editingContactId===el.dataset.delContact) state.editingContactId = null;
    await saveKey('contacts'); render();
  }));

  // projetos
  const addProjectForm = root.querySelector('[data-form="add-project"]');
  if(addProjectForm) addProjectForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const name = new FormData(e.target).get('name').trim(); if(!name) return;
    await createProject(name);
  });
  root.querySelectorAll('[data-quick-project]').forEach(el=>el.addEventListener('click', async ()=>{
    await createProject(el.dataset.quickProject);
  }));
  root.querySelectorAll('[data-open-project]').forEach(el=>el.addEventListener('click', ()=>{
    state.currentProject = el.dataset.openProject; render();
  }));
  const toggleArchivedBtn = root.querySelector('[data-toggle-archived]');
  if(toggleArchivedBtn) toggleArchivedBtn.addEventListener('click', ()=>{
    state.showArchivedProjects = !state.showArchivedProjects; render();
  });
  root.querySelectorAll('[data-archive-project]').forEach(el=>el.addEventListener('click', async ()=>{
    const p = state.data.projects.projects.find(p=>p.id===el.dataset.archiveProject);
    p.archived = true;
    logActivity(p, 'Projeto arquivado');
    await saveKey('projects'); render();
  }));
  root.querySelectorAll('[data-unarchive-project]').forEach(el=>el.addEventListener('click', async ()=>{
    const p = state.data.projects.projects.find(p=>p.id===el.dataset.unarchiveProject);
    p.archived = false;
    logActivity(p, 'Projeto desarquivado');
    await saveKey('projects'); render();
  }));
  const backBtn = root.querySelector('[data-back-projects]');
  if(backBtn) backBtn.addEventListener('click', ()=>{ state.currentProject=null; render(); });

  root.querySelectorAll('[data-change-status]').forEach(el=>el.addEventListener('change', async ()=>{
    const p = state.data.projects.projects.find(p=>p.id===el.dataset.changeStatus);
    p.status = el.value; logActivity(p, `Status alterado para ${PROJECT_STATUS[p.status]}`);
    await saveKey('projects'); render();
  }));
  root.querySelectorAll('[data-change-priority]').forEach(el=>el.addEventListener('change', async ()=>{
    const p = state.data.projects.projects.find(p=>p.id===el.dataset.changePriority);
    p.priority = el.value; await saveKey('projects'); render();
  }));
  root.querySelectorAll('[data-project-name]').forEach(el=>el.addEventListener('change', async ()=>{
    const p = state.data.projects.projects.find(p=>p.id===el.dataset.projectName);
    const val = el.value.trim(); if(!val) { el.value = p.name; return; }
    p.name = val; await saveKey('projects'); render();
  }));
  root.querySelectorAll('[data-budget-goal]').forEach(el=>el.addEventListener('change', async ()=>{
    const p = state.data.projects.projects.find(p=>p.id===el.dataset.budgetGoal);
    const val = parseFloat(el.value);
    p.budgetGoal = (isNaN(val)||val<0) ? null : val;
    await saveKey('projects'); render();
  }));
  root.querySelectorAll('[data-deadline-goal]').forEach(el=>el.addEventListener('change', async ()=>{
    const p = state.data.projects.projects.find(p=>p.id===el.dataset.deadlineGoal);
    p.deadlineGoal = el.value || null;
    await saveKey('projects'); render();
  }));
  root.querySelectorAll('[data-objective]').forEach(el=>el.addEventListener('change', async ()=>{
    const p = state.data.projects.projects.find(p=>p.id===el.dataset.objective);
    p.objective = el.value; await saveKey('projects');
  }));
  root.querySelectorAll('[data-notes]').forEach(el=>el.addEventListener('change', async ()=>{
    const p = state.data.projects.projects.find(p=>p.id===el.dataset.notes);
    p.notes = el.value; await saveKey('projects');
  }));
  const addChecklistForm = root.querySelector('[data-form="add-checklist"]');
  if(addChecklistForm) addChecklistForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const p = state.data.projects.projects.find(p=>p.id===e.target.dataset.pid);
    const fd = new FormData(e.target);
    const text = fd.get('text').trim(); if(!text) return;
    const valRaw = parseFloat(fd.get('value'));
    p.checklist.push({id:uid(), text, done:false, value:(isNaN(valRaw)?null:valRaw), startDate:fd.get('startDate')||null, endDate:fd.get('endDate')||null});
    autoUpdateStatus(p);
    await saveKey('projects'); render();
  });
  root.querySelectorAll('[data-toggle-checklist]').forEach(el=>el.addEventListener('click', async ()=>{
    const [pid,cid] = el.dataset.toggleChecklist.split(':');
    const p = state.data.projects.projects.find(p=>p.id===pid);
    const c = p.checklist.find(c=>c.id===cid);
    c.done = !c.done;
    if(c.done) logActivity(p, `Concluído: ${c.text}`);
    autoUpdateStatus(p);
    await saveKey('projects'); render();
  }));
  root.querySelectorAll('[data-checklist-value]').forEach(el=>el.addEventListener('change', async ()=>{
    const [pid,cid] = el.dataset.checklistValue.split(':');
    const p = state.data.projects.projects.find(p=>p.id===pid);
    const c = p.checklist.find(c=>c.id===cid);
    const val = parseFloat(el.value);
    c.value = (isNaN(val)||val<0) ? null : val;
    await saveKey('projects'); render();
  }));
  root.querySelectorAll('[data-checklist-start]').forEach(el=>el.addEventListener('change', async ()=>{
    const [pid,cid] = el.dataset.checklistStart.split(':');
    const p = state.data.projects.projects.find(p=>p.id===pid);
    const c = p.checklist.find(c=>c.id===cid);
    c.startDate = el.value || null;
    await saveKey('projects'); render();
  }));
  root.querySelectorAll('[data-checklist-end]').forEach(el=>el.addEventListener('change', async ()=>{
    const [pid,cid] = el.dataset.checklistEnd.split(':');
    const p = state.data.projects.projects.find(p=>p.id===pid);
    const c = p.checklist.find(c=>c.id===cid);
    c.endDate = el.value || null;
    await saveKey('projects'); render();
  }));
  root.querySelectorAll('[data-del-checklist]').forEach(el=>el.addEventListener('click', async ()=>{
    const [pid,cid] = el.dataset.delChecklist.split(':');
    const p = state.data.projects.projects.find(p=>p.id===pid);
    p.checklist = p.checklist.filter(c=>c.id!==cid);
    autoUpdateStatus(p);
    await saveKey('projects'); render();
  }));
  root.querySelectorAll('[data-proj-cal-nav]').forEach(el=>el.addEventListener('click', ()=>{
    const delta = parseInt(el.dataset.projCalNav);
    let m = state.projCalMonth + delta, y = state.projCalYear;
    if(m<0){ m=11; y--; } if(m>11){ m=0; y++; }
    state.projCalMonth=m; state.projCalYear=y; render();
  }));
  const addMilestoneForm = root.querySelector('[data-form="add-milestone"]');
  if(addMilestoneForm) addMilestoneForm.addEventListener('submit', async e=>{
    e.preventDefault();
    const p = state.data.projects.projects.find(p=>p.id===e.target.dataset.pid);
    const fd = new FormData(e.target);
    p.timeline.push({id:uid(), label:fd.get('label'), date:fd.get('date')});
    await saveKey('projects'); render();
  });
  root.querySelectorAll('[data-del-milestone]').forEach(el=>el.addEventListener('click', async ()=>{
    const [pid,tid] = el.dataset.delMilestone.split(':');
    const p = state.data.projects.projects.find(p=>p.id===pid);
    p.timeline = p.timeline.filter(t=>t.id!==tid);
    await saveKey('projects'); render();
  }));
  root.querySelectorAll('[data-del-project]').forEach(el=>el.addEventListener('click', async ()=>{
    if(!confirm('Excluir este projeto? Essa ação não pode ser desfeita.')) return;
    state.data.projects.projects = state.data.projects.projects.filter(p=>p.id!==el.dataset.delProject);
    state.currentProject = null;
    await saveKey('projects'); render();
  }));
}
async function createProject(name){
  state.data.projects.projects.push({
    id:uid(), name, status:'ideia', priority:'media', objective:'', checklist:[], timeline:[], activities:[], notes:'',
    budgetGoal:null, deadlineGoal:null, archived:false
  });
  state.formOpen.projetos = false;
  await saveKey('projects'); render();
}

document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && state.data){
    backgroundSync();
    fetchMailEmails();
    fetchCondoEmails();
  }
});
setInterval(()=>{ if(state.data) backgroundSync(); }, 30000);
setInterval(()=>{ if(state.data){ fetchMailEmails(); fetchCondoEmails(); } }, 120000);

boot();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E3D4E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Daily">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230E3D4E'/%3E%3Ctext x='50' y='66' font-size='48' font-family='Arial,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%230E3D4E'/%3E%3Ctext x='50' y='66' font-size='48' font-family='Arial,sans-serif' font-weight='700' fill='white' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Daily%20%E2%80%94%20planner%20do%20casal%22%2C%22short_name%22%3A%22Daily%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23FFFFFF%22%2C%22theme_color%22%3A%22%230E3D4E%22%7D">
<title>Daily — planner do casal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF;
    --surface:#FFFFFF;
    --surface-2:#F4F6F7;
    --ink:#0B1316;
    --ink-soft:#4C5B60;
    --ink-faint:#8B979A;
    --border:#E1E6E8;
    --primary:#0E3D4E;
    --primary-dark:#081F29;
    --primary-tint:#E5EDEF;
    --secondary:#0E3D4E;
    --secondary-tint:#E5EDEF;
    --urgent:#A63A32;
    --urgent-tint:#F3E4E2;
    --today:#0E3D4E;
    --today-tint:#E5EDEF;
    --mercado:#0E3D4E; --mercado-tint:#E5EDEF;
    --farmacia:#3A6B7D; --farmacia-tint:#EAF0F2;
    --escolar:#12262E; --escolar-tint:#E9EBEC;
    --casa:#6C8C97; --casa-tint:#EEF2F3;
    --outras:#9AA6A9; --outras-tint:#F1F3F3;
    --radius:14px;
    --radius-sm:9px;
    --shadow: 0 2px 14px rgba(11,19,22,0.06), 0 1px 2px rgba(11,19,22,0.05);
  }
  html[data-theme="dark"]{
    --bg:#0A1214;
    --surface:#111C1F;
    --surface-2:#162326;
    --ink:#EAF1F2;
    --ink-soft:#9FB0B4;
    --ink-faint:#647376;
    --border:#233236;
    --primary:#6FA8B8;
    --primary-dark:#9BC6D2;
    --primary-tint:#17282C;
    --secondary:#6FA8B8;
    --secondary-tint:#17282C;
    --urgent:#D98880;
    --urgent-tint:#3A2523;
    --today:#6FA8B8;
    --today-tint:#17282C;
    --mercado:#6FA8B8; --mercado-tint:#17282C;
    --farmacia:#7FA6B3; --farmacia-tint:#182629;
    --escolar:#C7D2D4; --escolar-tint:#1B2528;
    --casa:#8FA6AD; --casa-tint:#182629;
    --outras:#7C888B; --outras-tint:#1A2325;
    --shadow: 0 2px 14px rgba(0,0,0,0.4), 0 1px 2px rgba(0,0,0,0.32);
  }
  html{ transition:background-color .2s ease; }
  body, .card, .project-card, nav.tabs, .day-strip{ transition:background-color .2s ease, border-color .2s ease, color .2s ease; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0; overflow-x:hidden; width:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.display{ font-family:'Sora',sans-serif; letter-spacing:-0.01em; }
  button{ font-family:inherit; cursor:pointer; touch-action:manipulation; }
  input,select,textarea{ font-family:inherit; font-size:16px; color:var(--ink); background:var(--surface); }
  :focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }
  a{ color:var(--primary-dark); }

  #app{ max-width:920px; margin:0 auto; padding:0 16px calc(24px + env(safe-area-inset-bottom)); }

  .topbar{
    padding:max(22px, calc(14px + env(safe-area-inset-top))) 4px 14px;
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:11px; }
  .brand .mark{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px; border-radius:8px;
    background:var(--primary); color:#fff; font-family:'Sora',sans-serif; font-weight:700; font-size:15px; letter-spacing:0.02em;
  }
  .brand h1{ font-size:22px; margin:0; font-weight:700; color:var(--ink); letter-spacing:-0.02em; }
  .brand .tag{ font-size:12px; color:var(--ink-faint); letter-spacing:0.02em; }
  .day-strip{
    display:flex; align-items:center; gap:14px; flex-wrap:wrap;
    background:var(--surface); border:1px solid var(--border); border-radius:999px;
    padding:10px 20px; margin:0 0 14px; box-shadow:var(--shadow);
  }
  .day-strip-item{
    display:flex; align-items:center; gap:7px; font-size:13px; color:var(--ink-soft); white-space:nowrap;
  }
  .day-strip-item b{ color:var(--ink); font-weight:700; }
  .day-strip-icon{ font-size:14px; line-height:1; }
  .day-strip-divider{ width:1px; height:16px; background:var(--border); flex:0 0 auto; }
  @media (max-width:640px){
    .day-strip{ border-radius:14px; padding:11px 14px; gap:8px 12px; }
    .day-strip-divider{ display:none; }
    .day-strip-item{ font-size:12px; }
  }

  /* ===== Weather widget ===== */
  .weather-widget{
    position:relative; overflow:hidden; border-radius:var(--radius);
    padding:16px 18px 14px; margin:0 0 14px; box-shadow:var(--shadow);
    color:#fff; isolation:isolate;
  }
  .weather-widget-btn{ display:block; width:100%; text-align:left; border:none; font:inherit; cursor:pointer; }
  .weather-widget[data-cond="loading"]{ background:linear-gradient(135deg,#7C8FA0,#A6B4BF); }
  .weather-loading{ position:relative; z-index:1; font-size:13px; opacity:.92; }
  .weather-decor{ position:absolute; inset:0; pointer-events:none; z-index:0; }
  .weather-content{ position:relative; z-index:1; }

  .weather-widget[data-cond="clear-day"]{ background:linear-gradient(135deg,#4FA3E3,#7EC8F2 60%,#9ADCF0); }
  .weather-widget[data-cond="clear-day"] .weather-decor{ background:radial-gradient(circle at 84% 16%, rgba(255,255,255,.55), rgba(255,255,255,0) 42%); }

  .weather-widget[data-cond="clear-night"]{ background:linear-gradient(135deg,#0B1E3D,#1D3A66 60%,#2C4E82); }
  .weather-widget[data-cond="clear-night"] .weather-decor{
    background:
      radial-gradient(1.4px 1.4px at 20% 20%, rgba(255,255,255,.75), transparent),
      radial-gradient(1.2px 1.2px at 40% 12%, rgba(255,255,255,.55), transparent),
      radial-gradient(1px 1px at 65% 30%, rgba(255,255,255,.6), transparent),
      radial-gradient(1px 1px at 85% 16%, rgba(255,255,255,.45), transparent),
      radial-gradient(1.4px 1.4px at 75% 45%, rgba(255,255,255,.5), transparent),
      radial-gradient(1px 1px at 10% 45%, rgba(255,255,255,.4), transparent);
  }

  .weather-widget[data-cond="partly-day"]{ background:linear-gradient(135deg,#5DA3CC,#8FC3DD 60%,#B7D8E6); }
  .weather-widget[data-cond="partly-day"] .weather-decor{ background:radial-gradient(circle at 80% 15%, rgba(255,255,255,.4), rgba(255,255,255,0) 40%); }

  .weather-widget[data-cond="partly-night"]{ background:linear-gradient(135deg,#16233A,#2A3B57 60%,#3C4F6E); }

  .weather-widget[data-cond="cloudy"]{ background:linear-gradient(135deg,#6E7F8D,#8FA0AC 60%,#A9B7C1); }

  .weather-widget[data-cond="fog"]{ background:linear-gradient(135deg,#7C8993,#9BA7B0 60%,#B7C1C8); }
  .weather-widget[data-cond="fog"] .weather-decor{ background:repeating-linear-gradient(180deg, rgba(255,255,255,.12) 0 2px, transparent 2px 14px); }

  .weather-widget[data-cond="rain"]{ background:linear-gradient(135deg,#3C5875,#4E6E8C 60%,#63839E); }
  .weather-widget[data-cond="rain"] .weather-decor{ background:repeating-linear-gradient(115deg, rgba(255,255,255,.10) 0 1.5px, transparent 1.5px 12px); }

  .weather-widget[data-cond="storm"]{ background:linear-gradient(135deg,#262B44,#3A3F5C 60%,#4C5170); }
  .weather-widget[data-cond="storm"] .weather-decor{ background:repeating-linear-gradient(115deg, rgba(255,255,255,.08) 0 1.5px, transparent 1.5px 14px); }

  .weather-widget[data-cond="snow"]{ background:linear-gradient(135deg,#5B7286,#7F97A9 60%,#A6BAC7); }
  .weather-widget[data-cond="snow"] .weather-decor{
    background:
      radial-gradient(1.4px 1.4px at 15% 25%, rgba(255,255,255,.8), transparent),
      radial-gradient(1.4px 1.4px at 35% 55%, rgba(255,255,255,.7), transparent),
      radial-gradient(1.4px 1.4px at 55% 20%, rgba(255,255,255,.6), transparent),
      radial-gradient(1.4px 1.4px at 75% 60%, rgba(255,255,255,.7), transparent),
      radial-gradient(1.4px 1.4px at 90% 30%, rgba(255,255,255,.6), transparent);
  }

  .weather-row-top{ display:flex; align-items:center; justify-content:space-between; font-size:11.5px; font-weight:600; letter-spacing:.02em; opacity:.85; margin-bottom:10px; text-transform:capitalize; }
  .weather-row-main{ display:flex; align-items:center; gap:12px; }
  .weather-icon-lg{ width:44px; height:44px; flex:0 0 auto; }
  .weather-icon-lg svg{ width:100%; height:100%; display:block; }
  .weather-temp-block{ flex:0 0 auto; }
  .weather-temp-lg{ font-family:'Sora',sans-serif; font-size:34px; font-weight:700; line-height:1; letter-spacing:-0.02em; }
  .weather-desc{ font-size:12.5px; opacity:.9; margin-top:3px; }
  .weather-city-block{ margin-left:auto; text-align:right; background:none; border:none; color:#fff; font:inherit; cursor:pointer; padding:0; display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
  .weather-city{ font-size:12.5px; font-weight:600; opacity:.95; }
  .weather-minmax{ font-size:11.5px; opacity:.8; }
  .weather-rain{ position:relative; z-index:1; font-size:12px; opacity:.92; margin-top:10px; display:flex; align-items:center; gap:5px; }
  .weather-hourly{ margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,.22); }
  .weather-sparkline{ width:100%; height:24px; display:block; color:#fff; opacity:.9; margin-bottom:2px; }
  .weather-hour-list{ display:flex; justify-content:space-between; gap:4px; }
  .weather-hour{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.8px; opacity:.95; min-width:0; flex:1 1 0; }
  .wh-time{ opacity:.75; font-size:10px; }
  .wh-icon{ width:16px; height:16px; }
  .wh-icon svg{ width:100%; height:100%; display:block; }
  .wh-temp{ font-weight:700; font-size:12px; }
  .wh-precip{ font-size:9.5px; opacity:.85; min-height:11px; color:#DCEFFF; }

  @media (max-width:640px){
    .weather-widget{ padding:14px 14px 12px; }
    .weather-temp-lg{ font-size:29px; }
    .weather-icon-lg{ width:38px; height:38px; }
    .weather-hour{ font-size:10px; }
  }

  /* ===== Sync status line ===== */
  .sync-line{ font-size:11px; color:var(--ink-faint); display:flex; align-items:center; gap:6px; padding:0 2px 8px; }
  .sync-line.warn{ color:var(--urgent); font-weight:700; }
  .sync-dot{ width:6px; height:6px; border-radius:50%; background:#3AA65A; flex:0 0 auto; }
  .sync-dot.warn{ background:var(--urgent); }
  .link-inline{ background:none; border:none; padding:0; font:inherit; color:inherit; text-decoration:underline; cursor:pointer; }

  /* ===== Hero stats (resumo do dia) ===== */
  .hero-stats{
    display:flex; align-items:stretch; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden;
  }
  .hero-stat{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
    padding:9px 4px; position:relative; background:none; border:none; font:inherit; color:inherit; cursor:pointer;
  }
  .hero-stat + .hero-stat::before{
    content:''; position:absolute; left:0; top:22%; bottom:22%; width:1px; background:var(--border);
  }
  .hero-stat .n{ font-size:16px; font-weight:800; line-height:1; color:var(--ink); }
  .hero-stat .l{ font-size:9px; color:var(--ink-faint); font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin-top:2px; }
  .hero-stat.urgent .n{ color:var(--urgent); }
  .hero-stat.zero{ opacity:.5; }

  /* ===== Nav badges ===== */
  nav.tabs button{ position:relative; }
  .nav-badge{
    position:absolute; top:2px; right:6px; min-width:15px; height:15px; padding:0 4px; border-radius:999px;
    background:var(--ink-faint); color:#fff; font-size:9.5px; font-weight:800; display:flex; align-items:center; justify-content:center;
    line-height:1; border:1.5px solid var(--surface);
  }
  .nav-badge.urgent{ background:var(--urgent); }
  @media (max-width:640px){
    .nav-badge{ top:2px; right:16%; }
  }

  /* ===== Avatar (responsável) ===== */
  .avatar{
    width:20px; height:20px; border-radius:50%; flex:0 0 auto; display:flex; align-items:center; justify-content:center;
    font-size:9.5px; font-weight:800; color:#fff; margin-top:1px;
  }
  .empty-cta{ background:none; border:none; padding:0; font:inherit; font-size:12.5px; color:var(--primary-dark); font-weight:700; cursor:pointer; margin-top:4px; }
  .empty-cta:hover{ text-decoration:underline; }

  /* ===== FAB + ações rápidas ===== */
  .fab{
    position:fixed; right:22px; bottom:24px; width:56px; height:56px; border-radius:50%;
    background:var(--primary); color:#fff; border:none; display:flex; align-items:center; justify-content:center;
    font-size:27px; line-height:1; box-shadow:0 10px 24px rgba(14,61,78,.35), 0 2px 6px rgba(14,61,78,.25);
    z-index:60; transition:transform .18s ease, background .15s ease; cursor:pointer;
  }
  .fab:hover{ background:var(--primary-dark); }
  .fab.open{ transform:rotate(45deg); }
  .quick-actions{
    position:fixed; right:22px; bottom:92px; display:flex; flex-direction:column; gap:10px; align-items:flex-end; z-index:59;
  }
  .qa-btn{
    display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--border);
    border-radius:999px; padding:8px 16px 8px 8px; font-size:13px; font-weight:700; color:var(--ink);
    box-shadow:var(--shadow); animation:qa-in .15s ease; cursor:pointer;
  }
  .qa-btn .qa-ic{
    width:26px; height:26px; border-radius:50%; background:var(--primary-tint); color:var(--primary-dark);
    display:flex; align-items:center; justify-content:center; font-size:13px; flex:0 0 auto;
  }
  @keyframes qa-in{ from{ opacity:0; transform:translateY(6px) scale(.95); } to{ opacity:1; transform:none; } }
  @media (max-width:640px){
    .fab{ bottom:calc(78px + env(safe-area-inset-bottom) + 14px); right:16px; }
    .quick-actions{ bottom:calc(78px + env(safe-area-inset-bottom) + 78px); right:16px; }
  }

  /* ===== Botão "+ Novo X" (abre formulários sob demanda) ===== */
  .add-new-btn{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:12px; border-radius:var(--radius); border:1.6px dashed var(--border);
    background:var(--surface); color:var(--primary-dark); font-weight:700; font-size:14px;
    margin-bottom:14px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .add-new-btn:hover{ border-color:var(--primary); background:var(--primary-tint); }
  .add-new-btn .plus{ font-size:18px; line-height:1; }
  .form-card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; gap:8px; }
  .form-card-head .section-title{ margin:0; }

  nav.tabs{
    display:flex; gap:6px; overflow-x:auto; padding:4px 2px 14px;
    scrollbar-width:none;
  }
  nav.tabs::-webkit-scrollbar{ display:none; }
  nav.tabs button{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--border); color:var(--ink-soft);
    padding:9px 14px; border-radius:999px; font-size:13.5px; font-weight:600;
    transition:background .15s, color .15s, border-color .15s;
  }
  nav.tabs button svg{ width:15px; height:15px; }
  nav.tabs button.active{ background:var(--primary); border-color:var(--primary); color:#fff; }
  nav.tabs button:not(.active):hover{ border-color:var(--primary); color:var(--primary-dark); }

  .row-item{ min-height:44px; }
  .icon-btn{ min-width:32px; min-height:32px; }
  .item-name{ min-width:0; overflow-wrap:anywhere; }

  @media (max-width:640px){
    .card{ padding:15px; }
    .topbar{ padding-left:2px; padding-right:2px; }
    .brand h1{ font-size:21px; }

    nav.tabs{
      position:fixed; left:0; right:0; bottom:0; z-index:50;
      margin:0; padding:6px 4px calc(6px + env(safe-area-inset-bottom));
      background:var(--surface); border-top:1px solid var(--border);
      justify-content:space-between; gap:2px; box-shadow:0 -2px 10px rgba(35,43,39,0.06);
    }
    nav.tabs button{
      flex-direction:column; gap:3px; flex:1; min-width:0; padding:7px 2px;
      border:none; background:none; border-radius:10px; font-size:10.2px; font-weight:600;
    }
    nav.tabs button svg{ width:20px; height:20px; }
    nav.tabs button.active{ background:var(--primary-tint); color:var(--primary-dark); }
    nav.tabs button:not(.active):hover{ border-color:transparent; }
    nav.tabs .tab-label{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }

    #app{ padding-bottom:calc(78px + env(safe-area-inset-bottom)); }
    .grid{ gap:12px; }
    .proj-grid{ gap:12px; }
  }

  .card{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px;
  }
  .section-title{
    font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint);
    font-weight:700; margin:0 0 10px;
  }
  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:640px){ .grid{ grid-template-columns:1fr; } }
  .stack{ display:flex; flex-direction:column; gap:14px; }

  .alert{
    display:flex; align-items:flex-start; gap:10px;
    background:var(--today-tint); border:1px solid var(--border); color:var(--primary-dark);
    padding:12px 14px; border-radius:var(--radius-sm); font-size:13.5px; margin-bottom:10px;
  }
  .alert button.link{ background:none;border:none;color:var(--primary-dark); font-weight:700; text-decoration:underline; padding:0; font-size:13.5px;}
  .alert .x{ margin-left:auto; background:none;border:none;color:var(--primary-dark); font-size:16px; line-height:1; padding:0 2px;}

  /* ===== Avisos agrupados (card único, substitui a lista solta de alertas) ===== */
  .avisos-group-label{
    font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-faint); margin:12px 0 4px;
  }
  .avisos-group-label:first-child{ margin-top:0; }
  .aviso-row{
    display:flex; align-items:flex-start; gap:8px; padding:6px 0; border-bottom:1px solid var(--border);
  }
  .aviso-row:last-child{ border-bottom:none; }
  .aviso-icon{ font-size:14px; line-height:1.5; flex:0 0 auto; width:18px; text-align:center; }
  .aviso-text{ flex:1; min-width:0; font-size:13px; color:var(--ink-soft); line-height:1.45; }

  /* ===== Sino de avisos (badge + painel flutuante) ===== */
  .bell-badge{
    position:absolute; top:2px; right:2px; min-width:16px; height:16px; padding:0 4px; border-radius:999px;
    background:var(--urgent); color:#fff; font-size:9.5px; font-weight:800; display:flex; align-items:center; justify-content:center;
    line-height:1; border:1.5px solid var(--surface);
  }
  .avisos-backdrop{
    position:fixed; inset:0; background:rgba(11,19,22,.45); z-index:70; animation:avisos-fade .15s ease;
  }
  @keyframes avisos-fade{ from{opacity:0} to{opacity:1} }
  .avisos-panel{
    position:fixed; top:max(74px, calc(14px + env(safe-area-inset-top) + 58px)); right:16px;
    width:min(380px, calc(100vw - 32px)); max-height:min(70vh, 560px); overflow-y:auto;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);

<div id="app"><div class="loading">Carregando o Daily…</div></div>

<script>
// ---------- ADAPTADOR DE ARMAZENAMENTO ----------
// Dentro do Claude.ai existe window.storage (sincroniza entre pessoas/dispositivos).
// Quando o arquivo é aberto sozinho (baixado, file:// ou hospedado fora do Claude),
// window.storage não existe — nesse caso, usamos localStorage do navegador,
// que fica salvo apenas neste navegador/computador específico.
const hasNativeStorage = typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
const storage = hasNativeStorage ? window.storage : {
  async get(key, shared){
    const raw = localStorage.getItem('daily_local::'+key+'::'+shared);
    if(raw===null) throw new Error('not found');
    return {key, value: raw, shared};
  },
  async set(key, value, shared){
    localStorage.setItem('daily_local::'+key+'::'+shared, value);
    return {key, value, shared};
  },
  async delete(key, shared){
    localStorage.removeItem('daily_local::'+key+'::'+shared);
    return {key, deleted:true, shared};
  }
};

const ICONS = {
  home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2 3h2l2.6 12.4a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 2-1.6L22 7H6"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v14l-4 4H4z"/><path d="M8 9h8M8 13h5"/></svg>',
  house: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M9 21V12h6v9"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .7 3a2 2 0 0 1-.4 2.1L8 10.3a16 16 0 0 0 6 6l1.5-1.4a2 2 0 0 1 2.1-.4c1 .3 2 .5 3 .7a2 2 0 0 1 1.4 2.1z"/></svg>',
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const todayISO = () => new Date().toISOString().slice(0,10);
function fmtDate(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
}
function fmtDateWeekday(iso){
  const d = new Date(iso+'T00:00:00');
  const weekday = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()];
  return `${weekday}, ${fmtDate(iso)}`;
}
function fmtDateTime(iso){
  const d = new Date(iso);
  const datePart = d.toLocaleDateString('pt-BR', {day:'2-digit', month:'short'});
  const timePart = d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  return `${datePart} às ${timePart}`;
}
// Nomes conhecidos formatados como as lojas/transportadoras costumam se apresentar.
const KNOWN_SENDER_NAMES = {
  mercadolivre: 'Mercado Livre', correios: 'Correios', amazon: 'Amazon',
  shopee: 'Shopee', aliexpress: 'AliExpress', magazineluiza: 'Magazine Luiza',
  magalu: 'Magazine Luiza', casasbahia: 'Casas Bahia', americanas: 'Americanas',
  shein: 'Shein', netshoes: 'Netshoes', submarino: 'Submarino',
  pontofrio: 'Ponto Frio', kabum: 'KaBuM!', dafiti: 'Dafiti', centauro: 'Centauro',
  ifood: 'iFood', netflix: 'Netflix', jadlog: 'Jadlog', totalexpress: 'Total Express',
  loggi: 'Loggi', natura: 'Natura'
};
const SENDER_TLD_TOKENS = new Set(['com','br','net','org','io','co','uk','gov','edu','info','app','shop','store','mail']);
// Extrai um nome legível de quem enviou o e-mail (loja, transportadora, etc.):
// prioriza o nome de exibição do remetente (o que aparece no Gmail, ex: "Mercado Livre").
// Na falta dele, usa o domínio principal do e-mail (ignorando subdomínios como "info" ou "no-reply"
// e sufixos como ".com.br"), formatando com o nome conhecido da loja quando possível.
function parseSenderName(from){
  if(!from) return 'Remetente desconhecido';
  const raw = from.trim();
  const nameMatch = raw.match(/^"?([^"<]+?)"?\s*<[^>]+>$/);
  if(nameMatch && nameMatch[1].trim()) return nameMatch[1].trim();
  const emailMatch = raw.match(/([\w.+-]+)@([\w.-]+)/);
  if(emailMatch){
    const labels = emailMatch[2].split('.');
    while(labels.length>1 && SENDER_TLD_TOKENS.has(labels[labels.length-1].toLowerCase())){
      labels.pop();
    }
    const brand = (labels[labels.length-1] || emailMatch[2]).toLowerCase();
    if(KNOWN_SENDER_NAMES[brand]) return KNOWN_SENDER_NAMES[brand];
    return brand.charAt(0).toUpperCase()+brand.slice(1);
  }
  return raw;
}
// Alguns e-mails têm um "jeito de escrever" tão específico que dá pra saber a loja só pelo
// assunto, mesmo sem confiar no remetente (útil pra e-mail encaminhado, onde o remetente é
// uma pessoa, não a loja). Só entram aqui frases que uma ÚNICA loja usa — frases genéricas
// tipo "Seu pedido foi entregue" (usada por várias) ficam de fora de propósito, porque um
// palpite errado é pior do que não adivinhar.
const SUBJECT_STORE_SIGNATURES = [
  { pattern: /sua compra chegou,?\s*aproveite/i, store: 'Mercado Livre' },
  { pattern: /voc[êe]\s+recebeu\s+\d+\s+produto/i, store: 'Mercado Livre' },
  { pattern: /voc[êe]\s+recebeu\s+seu\s+pedido\s*#?\d+/i, store: 'Shopee' },
  { pattern: /oba!?\s*seu\s+pedido\s*#?\d+\s+foi\s+entregue/i, store: 'Shopee' },
];
function detectStoreFromSubject(subject){
  const text = subject || '';
  const hit = SUBJECT_STORE_SIGNATURES.find(sig => sig.pattern.test(text));
  return hit ? hit.store : null;
}

// Redimensiona/comprime a imagem escolhida pelo usuário pra um ícone pequeno (evita payloads
// gigantes ao sincronizar com o Google Sheets). Devolve um data URL JPEG já no tamanho certo.
function resizeImageFile(file, maxSize){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('não foi possível ler o arquivo'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=>reject(new Error('arquivo não parece ser uma imagem válida'));
      img.onload = ()=>{
        const scale = Math.min(1, maxSize/Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width*scale));
        const h = Math.max(1, Math.round(img.height*scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function getBrandVisual(storeName){

  const customLogos = (state.data && state.data.condo && state.data.condo.customLogos) || {};
  const logo = customLogos[storeName] || STORE_LOGOS[storeName] || DEFAULT_DELIVERY_LOGO;
  return {...base, logo};
}

// Extrai só o endereço de e-mail puro (sem nome de exibição), em minúsculas, pra usar como chave estável.
// Ex: 'João Silva <joao@gmail.com>' -> 'joao@gmail.com'.
function extractEmailAddress(from){
  if(!from) return null;
  const m = from.match(/([\w.+-]+@[\w.-]+)/);
  return m ? m[1].toLowerCase() : null;
}
// Nome do remetente pra exibir, em ordem de confiança:
// 1) apelido corrigido manualmente pra esse e-mail (a pessoa já disse qual é a loja certa);
// 2) padrão reconhecido no assunto (funciona mesmo em e-mail encaminhado, onde o remetente
//    vira a pessoa que encaminhou, não a loja);
// 3) nome extraído do campo "de:" do e-mail, como último recurso.
function getDisplaySenderName(it){
  const email = extractEmailAddress(it.from);
  const aliases = (state.data.condo && state.data.condo.senderAliases) || {};
  if(email && aliases[email]) return aliases[email];
  const bySubject = detectStoreFromSubject(it.subject);
  if(bySubject) return bySubject;
  return parseSenderName(it.from);
}
async function setSenderAlias(email, name){
  if(!email) return;
  if(!state.data.condo.senderAliases) state.data.condo.senderAliases = {};
  const trimmed = (name||'').trim();
  if(trimmed) state.data.condo.senderAliases[email] = trimmed;
  else delete state.data.condo.senderAliases[email]; // nome vazio remove a correção e volta ao automático
  await saveKey('condo');
  render();
}
// Pega o texto de conteúdo do e-mail (corpo/prévia) que o Apps Script tiver enviado,
// testando os nomes de campo mais comuns. Sem nenhum deles, cai de volta pro assunto.
function getEmailContentText(it){
  return it.snippet || it.preview || it.body || it.content || it.bodyPreview || it.subject || '';
}
// Procura no conteúdo do e-mail o trecho logo após "Você recebeu" (ex: "Você recebeu 5 produtos!" -> "5 produtos").
function extractReceivedInfo(it){
  const text = getEmailContentText(it);
  const m = text.match(/voc[êe]\s+recebeu\s+([^!.\n]+)[!.]?/i);
  return m ? m[1].trim() : null;
}
// Monta a linha de exibição no padrão "Loja - conteúdo - assunto":
// o trecho do meio vem do conteúdo do e-mail (o que veio depois de "Você recebeu"),
// e o assunto original do e-mail é sempre mostrado na sequência.
function formatCorreiosLine(sender, subject, extra){
  const parts = [sender];
  if(extra) parts.push(extra);
  const subj = (subject||'').trim();
  parts.push(subj || '(sem assunto)');
  return parts.join(' - ');
}
function fmtDateFull(iso){
  const d = new Date(iso+'T00:00:00');
  return d.toLocaleDateString('pt-BR', {weekday:'long', day:'2-digit', month:'long'});
}
function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtBRL(n){
  return (n||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
}
function daysDiff(dateA, dateB){
  const a = new Date(dateA); a.setHours(0,0,0,0);
  const b = new Date(dateB); b.setHours(0,0,0,0);
  return Math.round((a-b)/86400000);
}
function nextOccurrence(ev){
  const base = new Date(ev.date+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  let d = new Date(base);
  if(!ev.recurring || ev.recurring==='none') return d;
  if(ev.recurring==='yearly'){
    d.setFullYear(now.getFullYear());
    if(d<now) d.setFullYear(now.getFullYear()+1);
  } else if(ev.recurring==='monthly'){
    d = new Date(now.getFullYear(), now.getMonth(), base.getDate());
    if(d<now) d.setMonth(d.getMonth()+1);
  } else if(ev.recurring==='weekly'){
    while(d<now) d.setDate(d.getDate()+7);
  }
  return d;
}

function productIcon(name, category){
  const norm = (name||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  for(const [keywords, icon] of PRODUCT_ICONS){
    for(const kw of keywords){
      const kwNorm = kw.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
      if(norm.includes(kwNorm)) return icon;
    }
  }
  const fallback = {mercado:'🛒', farmacia:'💊', escolar:'✏️', casa:'🏠', outras:'📦'};
  return fallback[category] || '🛍️';
}

function normalizeText(s){
  return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function getCategoria(name){
  const norm = normalizeText(name);
  let best = null, bestLen = 0;
  for(const [label, keywords] of CATEGORIA_MAP){
    for(const kw of keywords){
      const kwNorm = normalizeText(kw);
      if(kwNorm && norm.includes(kwNorm) && kwNorm.length>bestLen){
        best = label; bestLen = kwNorm.length;
      }
    }
  }
  return best || 'Outros';
}
const CATEGORIA_LABELS = [...CATEGORIA_MAP.map(c=>c[0]), 'Outros'];

function resolveCategoria(name){
  const overrides = state.data?.shopping?.categoriaOverrides || {};
  const manual = overrides[(name||'').toLowerCase()];
  return manual || getCategoria(name);
}

// ---------- PERSISTÊNCIA ----------
// window.storage é a fonte confiável (sempre funciona neste ambiente).
// O Google Sheets é o espelho AUTOMÁTICO e fixo — não há tela de configuração manual.
// Se o Sheets estiver indisponível por qualquer motivo, o app continua funcionando
// normalmente com a cópia local, e volta a sincronizar sozinho assim que possível.
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbx3Un4MF7we918-Vf4jVFIRDTyqBfuQyTf_3CzaY3UL6jtD7zFf8etfckgwoiOm19tXxg/exec';
let sheetsConfig = { url: SHEETS_URL, enabled: true };
// Evita que uma requisição travada (Apps Script demorando pra "acordar", rede instável etc.)
// fique pendurada pra sempre — corta e desiste depois de um tempo limite.
async function fetchWithTimeout(url, options, timeoutMs){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), timeoutMs);
  try{
    return await fetch(url, {...(options||{}), signal:controller.signal});
  } finally {
    clearTimeout(timer);
  }
}
// Faz a requisição ao Apps Script com 1 nova tentativa automática antes de desistir —
// suaviza falhas passageiras (cold start do Apps Script, oscilação de rede) sem precisar
// que a pessoa perceba ou tente de novo manualmente.
async function sheetsRequest(url, options, attempt){
  attempt = attempt || 0;
  try{
    return await fetchWithTimeout(url, options, 12000);
  }catch(e){
    if(attempt<1){
      await new Promise(r=>setTimeout(r, 900));
      return sheetsRequest(url, options, attempt+1);
    }
    if(e && e.name==='AbortError') throw new Error('tempo de resposta esgotado (o Apps Script pode estar demorando pra iniciar)');
    throw e;
  }
}
async function sheetsGet(key, shared){
  if(!sheetsConfig.enabled || !sheetsConfig.url) throw new Error('sincronização desligada');
  const url = `${sheetsConfig.url}?key=${encodeURIComponent(key)}&shared=${shared}`;
  const res = await sheetsRequest(url, {}, 0);
  const text = await res.text();
  if(!res.ok) throw new Error('HTTP '+res.status+': '+text.slice(0,180));
  try{ return text ? JSON.parse(text) : null; }
  catch(e){ throw new Error('resposta não é JSON — a implantação pode estar pedindo login do Google. Início da resposta: '+text.slice(0,150)); }
}
async function sheetsSet(key, value, shared){
  if(!sheetsConfig.enabled || !sheetsConfig.url) throw new Error('sincronização desligada');
  const res = await sheetsRequest(sheetsConfig.url, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // evita preflight CORS no Apps Script
    body: JSON.stringify({action:'set', key, value, shared})
  }, 0);
  const text = await res.text();
  if(!res.ok) throw new Error('HTTP '+res.status+': '+text.slice(0,180));
  try{ return text ? JSON.parse(text) : null; }
  catch(e){ throw new Error('resposta não é JSON ao salvar — a implantação pode estar pedindo login do Google. Início da resposta: '+text.slice(0,150)); }
}
async function testSheetsConnection(url){
  if(!url) return {ok:false, message:'Cole a URL do Apps Script primeiro.'};
  try{
    const res = await fetchWithTimeout(`${url}?key=daily:ping&shared=true`, {}, 12000);
    const text = await res.text();
    if(!res.ok) return {ok:false, message:'A URL respondeu com erro HTTP '+res.status+'. Detalhe: '+text.slice(0,150)};
    try{ JSON.parse(text || 'null'); }
    catch(e){ return {ok:false, message:'A implantação respondeu algo que não é JSON — provavelmente está pedindo login do Google. Confira se "Quem pode acessar" está como "Qualquer pessoa" (não "Qualquer pessoa com conta Google"). Início da resposta: '+text.slice(0,150)}; }
    return {ok:true, message:'Conectado com sucesso! ✅'};
  }catch(e){
    const msg = e && e.name==='AbortError' ? 'tempo de resposta esgotado' : (e&&e.message?e.message:'erro de rede');
    return {ok:false, message:'Não foi possível conectar: '+msg+'. Confira a URL e a implantação.'};
  }
}

// Implementação própria de SHA-256 em JS puro: não depende de crypto.subtle,
// que pode não estar disponível em alguns contextos de iframe/sandbox.
function sha256Hex(text){
  const bytes = new TextEncoder().encode(text);
  const K = [
    0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
    0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
    0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
    0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
    0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
    0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
    0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
    0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2
  ];
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const l = bytes.length;
  const padded = new Uint8Array((((l+9+63)>>6)<<6));
  padded.set(bytes);
  padded[l] = 0x80;
  const dv = new DataView(padded.buffer);
  dv.setUint32(padded.length-8, Math.floor(l*8/0x100000000));
  dv.setUint32(padded.length-4, (l*8)>>>0);
  const rotr = (x,n)=> (x>>>n) | (x<<(32-n));
  for(let chunk=0; chunk<padded.length; chunk+=64){
    const w = new Array(64);
    for(let i=0;i<16;i++) w[i] = dv.getUint32(chunk+i*4);
    for(let i=16;i<64;i++){
      const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15]>>>3);
      const s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2]>>>10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }
    let [a,b,c,d,e,f,g,h] = H;
    for(let i=0;i<64;i++){
      const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
      const ch = (e & f) ^ (~e & g);
      const temp1 = (h + S1 + ch + K[i] + w[i]) >>> 0;
      const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const temp2 = (S0 + maj) >>> 0;
      h=g; g=f; f=e; e=(d+temp1)>>>0;
      d=c; c=b; b=a; a=(temp1+temp2)>>>0;
    }
    H = [(H[0]+a)>>>0,(H[1]+b)>>>0,(H[2]+c)>>>0,(H[3]+d)>>>0,(H[4]+e)>>>0,(H[5]+f)>>>0,(H[6]+g)>>>0,(H[7]+h)>>>0];
  }
  return H.map(x=>x.toString(16).padStart(8,'0')).join('');
}
function isValidEmail(str){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(str);
}
function profileLabel(u){
  return u.name && u.name.trim() ? u.name : u.email;
}
async function boot(){
  bootAuth();
}
async function bootAuth(){
  try{
    const local = await storage.get('daily:device-auth', false);
    if(local && local.value==='true'){
      try{
        const du = await storage.get('daily:device-user', false);
        if(du){
          const parsed = JSON.parse(du.value);
          state.currentUser = parsed.name || parsed.email;
          state.currentEmail = parsed.email;
        }
      }catch(e){}
      init();
      return;
    }
  }catch(e){}

  renderLock({status:'loading'});
  let stored = null;
  try{
    const cached = await storage.get('daily:auth-cache', true);
    stored = (cached && cached.value) ? JSON.parse(cached.value) : null;
  }catch(e){}
  // tenta o Sheets só se estiver configurado/ligado; nunca bloqueia o login
  if(sheetsConfig.enabled && sheetsConfig.url){
    try{
      const res = await sheetsGet('daily:auth', true);
      if(res && res.value){
        stored = JSON.parse(res.value);
        storage.set('daily:auth-cache', res.value, true).catch(()=>{});
      }
    }catch(e){ /* Sheets fora do ar — segue com o que já temos localmente */ }
  }
  const users = (stored && stored.users) ? stored.users : [];
  if(!users.length){
    renderLock({status:'create', users, isFirst:true});
  } else {
    renderLock({status:'select', users});
  }
}
async function saveAuthUsers(users){
  const value = JSON.stringify({users});
  await storage.set('daily:auth-cache', value, true).catch(()=>{});
  if(sheetsConfig.enabled && sheetsConfig.url){
    sheetsSet('daily:auth', value, true).catch(()=>{}); // segundo plano, não trava o login
  }
}
function renderLock(authState){
  const app = document.getElementById('app');
  let body = '';
  if(authState.status==='loading'){
    body = `<div class="loading">Verificando acesso…</div>`;
  } else if(authState.status==='select'){
    body = `
      <p>Quem é você?</p>
      <div class="profile-list">
        ${authState.users.map(u=>`<button class="btn secondary" style="width:100%;margin-bottom:8px;text-align:left" data-select-user="${escapeHtml(u.email)}">
          <div style="font-weight:700">${escapeHtml(profileLabel(u))}</div>
          ${u.name? `<div style="font-size:11.5px;opacity:.7;font-weight:500">${escapeHtml(u.email)}</div>` : ''}
        </button>`).join('')}
      </div>
      <button class="btn ghost small" data-new-profile style="margin-top:6px;width:100%">+ Criar meu perfil</button>
    `;
  } else if(authState.status==='password'){
    const user = authState.users.find(u=>u.email===authState.email);
    body = `
      <button type="button" class="back-link" data-back-select>← Voltar</button>
      <p>Olá, <b>${escapeHtml(user? profileLabel(user) : authState.email)}</b>. Digite sua senha para entrar.</p>
      <form id="lock-form" novalidate>
        <input type="password" id="lock-pw1" placeholder="Sua senha" autocomplete="current-password">
        <div id="lock-error" class="lock-error"></div>
        <button class="btn" type="submit">Entrar</button>
      </form>
    `;
  } else if(authState.status==='create'){
    body = `
      ${!authState.isFirst? `<button type="button" class="back-link" data-back-select>← Voltar</button>` : ''}
      <p>${authState.isFirst? 'Este é o primeiro acesso ao Daily. Crie seu perfil pessoal com seu e-mail.' : 'Crie seu perfil pessoal para entrar no Daily.'}</p>
      <form id="lock-form" novalidate>
        <input type="email" id="lock-email" placeholder="Seu e-mail" autocomplete="email">
        <input type="text" id="lock-name" placeholder="Como quer ser chamado (opcional)" autocomplete="name" maxlength="24">
        <input type="password" id="lock-pw1" placeholder="Criar senha" autocomplete="new-password" minlength="4">
        <input type="password" id="lock-pw2" placeholder="Confirmar senha" autocomplete="new-password" minlength="4">
        <div id="lock-error" class="lock-error"></div>
        <button class="btn" type="submit">Criar perfil e entrar</button>
      </form>
    `;
  }
  app.innerHTML = `
    <div class="lock-screen">
      <div class="lock-card">
        <span class="mark">D</span>
        <h2>Daily</h2>
        ${body}
      </div>
    </div>
  `;
  if(authState.status==='select'){
    document.querySelectorAll('[data-select-user]').forEach(b=>b.addEventListener('click', ()=>{
      renderLock({status:'password', email:b.dataset.selectUser, users:authState.users});
    }));
    const newBtn = document.querySelector('[data-new-profile]');
    if(newBtn) newBtn.addEventListener('click', ()=> renderLock({status:'create', users:authState.users, isFirst:false}));
    return;
  }
  const backBtn = document.querySelector('[data-back-select]');
  if(backBtn) backBtn.addEventListener('click', ()=> renderLock({status:'select', users:authState.users}));

  const form = document.getElementById('lock-form');
  if(!form) return;
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const errorEl = document.getElementById('lock-error');
    errorEl.textContent = '';
    try{
      const pw1 = document.getElementById('lock-pw1').value;

      if(authState.status==='create'){
        const email = document.getElementById('lock-email').value.trim().toLowerCase();
        const name = document.getElementById('lock-name').value.trim();
        const pw2 = document.getElementById('lock-pw2').value;
        if(!email){ errorEl.textContent = 'Digite seu e-mail.'; return; }
        if(!isValidEmail(email)){ errorEl.textContent = 'Digite um e-mail válido.'; return; }
        if(authState.users.some(u=>u.email.toLowerCase()===email)){ errorEl.textContent = 'Já existe um perfil com esse e-mail.'; return; }
        if(!pw1 || pw1.length<4){ errorEl.textContent = 'A senha precisa ter pelo menos 4 caracteres.'; return; }
        if(pw1 !== pw2){ errorEl.textContent = 'As senhas não coincidem.'; return; }
        const hash = sha256Hex(pw1);
        const users = [...authState.users, {email, name, hash}];
        await saveAuthUsers(users);
        storage.set('daily:device-auth', 'true', false).catch(()=>{});
        storage.set('daily:device-user', JSON.stringify({email, name}), false).catch(()=>{});
        state.currentUser = name || email;
        state.currentEmail = email;
        init();
      } else if(authState.status==='password'){
        if(!pw1){ errorEl.textContent = 'Digite sua senha.'; return; }
        const hash = sha256Hex(pw1);
        const user = authState.users.find(u=>u.email===authState.email);
        if(user && hash === user.hash){
          storage.set('daily:device-auth', 'true', false).catch(()=>{});
          storage.set('daily:device-user', JSON.stringify({email:user.email, name:user.name}), false).catch(()=>{});
          state.currentUser = user.name || user.email;
          state.currentEmail = user.email;
          init();
        } else {
          errorEl.textContent = 'Senha incorreta. Tente de novo.';
        }
      }
    }catch(err){
      console.error('Erro no formulário de acesso:', err);
      errorEl.textContent = 'Ocorreu um erro inesperado (' + (err && err.message ? err.message : 'desconhecido') + '). Tente de novo.';
    }
  });
}
function logout(){
  storage.delete('daily:device-auth', false).catch(()=>{});
  storage.delete('daily:device-user', false).catch(()=>{});
  location.reload();
}

// Detecta se um conjunto de dados está "vazio" (sem nenhum registro real).
// Usado como rede de segurança: se a nuvem devolver algo vazio mas o cache local
// deste aparelho já tinha dados de verdade, isso é sinal de perda de dados na nuvem
// (outro aparelho sincronizando com cache velho, edição manual na planilha, etc) —
// não deixamos isso apagar o que existe localmente.
function isEmptyDataset(key, obj){
  try{
    if(!obj) return true;
    switch(key){
      case 'shopping':
        return Object.values(obj.lists||{}).every(l=>!l || l.length===0)
          && (!obj.stock || Object.keys(obj.stock).length===0)
          && (!obj.purchases || obj.purchases.length===0)
          && (!obj.history || obj.history.length===0)
          && (!obj.favorites || obj.favorites.length===0);
      case 'agenda': return !obj.events || obj.events.length===0;
      case 'messages': return !obj.messages || obj.messages.length===0;
      case 'home': return !obj.tasks || obj.tasks.length===0;
      case 'contacts': return !obj.contacts || obj.contacts.length===0;
      case 'projects': return !obj.projects || obj.projects.length===0;
      case 'condo': return !obj.receivedIds || obj.receivedIds.length===0;
      default: return false;
    }
  }catch(e){ return false; }
}
async function loadKey(key){
  const storageKey = 'daily:'+key;
  let value = null;
  try{
    const cached = await storage.get(storageKey, true);
    if(cached) value = cached.value;
  }catch(e){}
  if(sheetsConfig.enabled && sheetsConfig.url){
    try{
      const res = await sheetsGet(storageKey, true);
      if(res && res.value!=null){
        let localLooksReal = false, incomingLooksEmpty = false;
        try{ localLooksReal = value!=null && !isEmptyDataset(key, JSON.parse(value)); }catch(e){}
        try{ incomingLooksEmpty = isEmptyDataset(key, JSON.parse(res.value)); }catch(e){}
        if(localLooksReal && incomingLooksEmpty){
          // A nuvem devolveu algo vazio, mas este aparelho tem dados reais no cache —
          // não sobrescreve; mantém o local e reenvia pra nuvem pra se autocurar.
          console.warn('[proteção de dados] "'+key+'" veio vazio do Sheets, mas havia dados locais — mantendo local e reenviando.');
          mirrorToSheets(storageKey, value, true);
        } else {
          value = res.value;
          storage.set(storageKey, value, true).catch(()=>{});
        }
      }
      state.syncStatus = 'ok';
      state.syncErrorMessage = null;
      state.lastSyncSuccessAt = Date.now();
    }catch(e){
      console.warn('Sheets indisponível, usando cache local para', key, e);
      state.syncStatus = 'error';
      state.syncErrorMessage = e && e.message ? e.message : 'erro desconhecido';
    }
  }
  if(value!=null) return JSON.parse(value);
  return JSON.parse(JSON.stringify(DEFAULTS[key]));
}
// Versão rápida de loadKey: só lê o armazenamento local, sem esperar o Google Sheets.
// Usada na abertura do app pra a primeira tela aparecer na hora — o Sheets é sincronizado
// depois, em segundo plano (ver init()), em vez de travar o carregamento inicial em até
// 7 requisições ao Apps Script antes de mostrar qualquer coisa na tela.

  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULTS[key]));
}
async function saveKey(key){
  const storageKey = 'daily:'+key;
  const value = JSON.stringify(state.data[key]);
  await storage.set(storageKey, value, true).catch(()=>{}); // fonte confiável, sempre salva aqui (rápido)
  mirrorToSheets(storageKey, value, true); // Sheets em segundo plano — nunca trava a interface

function mirrorToSheets(storageKey, value, shared){
  if(!sheetsConfig.enabled || !sheetsConfig.url) return;
  sheetsSet(storageKey, value, shared).then(()=>{
    state.syncStatus = 'ok';
    state.syncErrorMessage = null;
    state.lastSyncSuccessAt = Date.now();
  }).catch(e=>{
    console.error('erro ao espelhar no Google Sheets', storageKey, e);
    state.syncStatus = 'error';
    state.syncErrorMessage = e && e.message ? e.message : 'erro desconhecido';
    // só atualiza a tela com o aviso se a pessoa não estiver digitando em algo agora
    const active = document.activeElement;
    if(!active || !['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) render();
  });
}

async function init(){

  const [shopping, agenda, messages, home, contacts, projects, condo, theme] = await Promise.all([
    loadKeyLocalOnly('shopping'), loadKeyLocalOnly('agenda'), loadKeyLocalOnly('messages'), loadKeyLocalOnly('home'),
    loadKeyLocalOnly('contacts'), loadKeyLocalOnly('projects'), loadKeyLocalOnly('condo'), loadTheme()
  ]);
  state.data = {shopping, agenda, messages, home, contacts, projects, condo};
  if(!state.data.shopping.prices) state.data.shopping.prices = {};
  if(!state.data.shopping.categoriaOverrides) state.data.shopping.categoriaOverrides = {};
  state.theme = theme;
  applyTheme();
  migrateStock();
  migrateProjects();
  migrateAgenda();
  migrateHomeTasks();
  await seedDefaultStock();
  await loadWeatherLocation();
  render();

  // a partir daqui, tudo roda em segundo plano — nada disso trava a tela inicial
  fetchWeather();
  fetchMailEmails();
  fetchCondoEmails();
  syncNow().then(()=>{
    migrateStock();
    migrateProjects();
    migrateAgenda();
    migrateHomeTasks();
    const active = document.activeElement;
    const isTyping = active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName);
    if(!isTyping) render(); // atualiza a tela se o Sheets trouxer algo diferente do que já estava salvo localmente
  }).catch(()=>{});
}
function safeRender(){

  // se ela estiver digitando em algum campo agora

  if(active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) return;
  render();
}

let travelInfoCache = {};
async function geocodeCityUF(city, uf){
  const query = uf ? `${city}, ${uf}` : city;
  const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query.trim())}&count=1&language=pt&country=BR`);
  const data = await res.json();
  const r = data && data.results && data.results[0];
  if(!r) return null;
  return {lat:r.latitude, lon:r.longitude};
}
async function geocodeCEP(cepRaw){
  const cep = (cepRaw||'').replace(/\D/g,'');
  if(cep.length!==8) return null;
  try{
    const viaRes = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
    const via = await viaRes.json();
    if(!via || via.erro) return null;
    const streetQuery = [via.logradouro, via.bairro, via.localidade, via.uf, 'Brazil'].filter(Boolean).join(', ');
    const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(streetQuery)}&limit=1&countrycodes=br`, {
      headers: {'Accept-Language':'pt-BR'}
    });
    const geoData = await geoRes.json();
    let hit = geoData && geoData[0];
    if(!hit){
      // não achou o endereço exato — cai pra geocodificar só a cidade do CEP
      const cityQuery = [via.localidade, via.uf, 'Brazil'].filter(Boolean).join(', ');
      const geoRes2 = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(cityQuery)}&limit=1&countrycodes=br`, {
        headers: {'Accept-Language':'pt-BR'}
      });
      const geoData2 = await geoRes2.json();
      hit = geoData2 && geoData2[0];
    }
    if(!hit) return null;
    let cepLabel = `${via.logradouro? via.logradouro+', ':''}${via.localidade} - ${via.uf}`;
    if(cepLabel.length > 48) cepLabel = cepLabel.slice(0,45).trim() + '…';
    return {
      lat: parseFloat(hit.lat), lon: parseFloat(hit.lon),
      city: via.localidade, uf: via.uf,
      label: cepLabel
    };
  }catch(e){
    return null;
  }
}
async function geocodePlace(query){
  if(!query || !query.trim()) return null;
  try{
    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&countrycodes=br&q=${encodeURIComponent(query.trim())}`, {
      headers: {'Accept-Language':'pt-BR'}
    });
    const data = await res.json();
    const hit = data && data[0];
    if(!hit) return null;
    const addr = hit.address || {};
    const cep = addr.postcode ? addr.postcode.replace(/\D/g,'') : null;
    const city = addr.city||addr.town||addr.village||null;
    const uf = addr.state ? stateNameToUF_(addr.state) : null;
    // monta um rótulo curto e padronizado: Nome/Rua, Cidade - UF (nunca o nome do estado por extenso)
    const mainPart = hit.name || addr.road || null;
    const parts = [mainPart, city].filter(Boolean);
    let shortLabel = parts.length ? parts.join(', ') : hit.display_name.split(',').slice(0,2).join(',').trim();
    if(uf && !shortLabel.endsWith(uf)) shortLabel += ' - ' + uf;
    if(shortLabel.length > 48) shortLabel = shortLabel.slice(0,45).trim() + '…'; // rede de segurança contra nomes muito longos
    return {
      lat: parseFloat(hit.lat), lon: parseFloat(hit.lon),
      cep, city, uf,
      label: shortLabel
    };
  }catch(e){
    return null;
  }
}
function stateNameToUF_(stateName){
  const map = {
    'Acre':'AC','Alagoas':'AL','Amapá':'AP','Amazonas':'AM','Bahia':'BA','Ceará':'CE','Distrito Federal':'DF',
    'Espírito Santo':'ES','Goiás':'GO','Maranhão':'MA','Mato Grosso':'MT','Mato Grosso do Sul':'MS','Minas Gerais':'MG',
    'Pará':'PA','Paraíba':'PB','Paraná':'PR','Pernambuco':'PE','Piauí':'PI','Rio de Janeiro':'RJ',
    'Rio Grande do Norte':'RN','Rio Grande do Sul':'RS','Rondônia':'RO','Roraima':'RR','Santa Catarina':'SC',
    'São Paulo':'SP','Sergipe':'SE','Tocantins':'TO'
  };
  return map[stateName] || null;
}
async function getRouteInfo(originLat, originLon, destLat, destLon){
  const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${originLon},${originLat};${destLon},${destLat}?overview=false`);
  const data = await res.json();
  const route = data && data.routes && data.routes[0];
  if(!route) return null;
  return { km: route.distance/1000, minutes: route.duration/60 };
}
async function computeTravelInfo(ev){
  const cacheKey = `${ev.id}:${ev.place||''}:${ev.cep||''}:${ev.city}:${ev.uf}:${weatherLoc.label}`;
  if(travelInfoCache[cacheKey]) return;
  travelInfoCache[cacheKey] = {status:'loading'};
  try{
    let dest = null;
    let preciseAddress = null;
    if(ev.place){
      const placeLoc = await geocodePlace(ev.place);
      if(placeLoc){ dest = placeLoc; preciseAddress = placeLoc.label; }
    }
    if(!dest && ev.cep){
      const cepLoc = await geocodeCEP(ev.cep);
      if(cepLoc){ dest = cepLoc; preciseAddress = cepLoc.label; }
    }
    if(!dest && ev.city){
      dest = await geocodeCityUF(ev.city, ev.uf);
    }
    if(!dest){
      travelInfoCache[cacheKey] = {status:'error', message:'Endereço não encontrado'};
    } else {
      const route = await getRouteInfo(weatherLoc.lat, weatherLoc.lon, dest.lat, dest.lon);
      if(!route){
        travelInfoCache[cacheKey] = {status:'error', message:'Rota não encontrada'};
      } else {
        travelInfoCache[cacheKey] = {status:'ok', km:route.km, minutes:route.minutes, preciseAddress, foundCep:dest.cep||null};
      }
    }
  }catch(e){
    travelInfoCache[cacheKey] = {status:'error', message:'Não foi possível calcular agora'};
  }
  safeRender();
}
function getTravelInfo(ev){
  const cacheKey = `${ev.id}:${ev.place||''}:${ev.cep||''}:${ev.city}:${ev.uf}:${weatherLoc.label}`;
  const cached = travelInfoCache[cacheKey];
  if(!cached) computeTravelInfo(ev); // dispara o cálculo em segundo plano
  return cached || {status:'loading'};
}
function renderTravelInfo(ev){
  if(!ev.place && !ev.city && !ev.cep) return ''; // nada preenchido, não calcula nem mostra nada
  const info = getTravelInfo(ev);
  if(info.status==='loading') return `<div class="contact-role" style="margin-top:2px">🚗 buscando local e calculando trajeto…</div>`;
  if(info.status==='error') return `<div class="contact-role" style="margin-top:2px">🚗 não encontramos esse local — confira o texto digitado</div>`;
  const hours = Math.floor(info.minutes/60);
  const mins = Math.round(info.minutes%60);
  const timeStr = hours>0 ? `${hours}h${String(mins).padStart(2,'0')}` : `${mins} min`;
  const destino = info.preciseAddress ? escapeHtml(info.preciseAddress) : `${escapeHtml(ev.city||'')}${ev.uf?'/'+escapeHtml(ev.uf):''}`;
  const cepInfo = info.foundCep ? ` · CEP ${info.foundCep.slice(0,5)}-${info.foundCep.slice(5)}` : '';
  return `<div class="contact-role" style="margin-top:2px;overflow-wrap:anywhere;word-break:break-word">🚗 ${info.km.toFixed(0)} km · ~${timeStr} até ${destino}${cepInfo}</div>`;
}

async function fetchWeather(){
  state.weather = {status:'loading'};
  try{
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${weatherLoc.lat}&longitude=${weatherLoc.lon}&current=temperature_2m,weather_code,wind_speed_10m,relative_humidity_2m&hourly=temperature_2m,weather_code,precipitation_probability&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset&forecast_days=2&timezone=auto`);
    if(!res.ok) throw new Error('http '+res.status);
    const wx = await res.json();
    const nowISO = wx.current.time || '';
    const sunrise = wx.daily && wx.daily.sunrise ? wx.daily.sunrise[0] : null;
    const sunset = wx.daily && wx.daily.sunset ? wx.daily.sunset[0] : null;
    const isDay = (sunrise && sunset && nowISO) ? (nowISO >= sunrise && nowISO <= sunset) : true;

    let hourly = [];
    if(wx.hourly && wx.hourly.time && wx.hourly.time.length){
      let startIdx = wx.hourly.time.findIndex(t => t >= nowISO);
      if(startIdx < 0) startIdx = 0;
      hourly = wx.hourly.time.slice(startIdx, startIdx+6).map((t,i)=>{
        const idx = startIdx+i;
        return {
          label: t.slice(11,16),
          temp: Math.round(wx.hourly.temperature_2m[idx]),
          code: wx.hourly.weather_code[idx],
          precip: wx.hourly.precipitation_probability ? wx.hourly.precipitation_probability[idx] : null
        };
      });
    }

    state.weather = {
      status:'ok',
      temp: Math.round(wx.current.temperature_2m),
      code: wx.current.weather_code,
      isDay,
      time: nowISO ? nowISO.slice(11,16) : '',
      windSpeed: wx.current.wind_speed_10m!=null ? Math.round(wx.current.wind_speed_10m) : null,
      humidity: wx.current.relative_humidity_2m!=null ? Math.round(wx.current.relative_humidity_2m) : null,
      tempMax: wx.daily && wx.daily.temperature_2m_max ? Math.round(wx.daily.temperature_2m_max[0]) : null,
      tempMin: wx.daily && wx.daily.temperature_2m_min ? Math.round(wx.daily.temperature_2m_min[0]) : null,
      tempMinTomorrow: wx.daily && wx.daily.temperature_2m_min && wx.daily.temperature_2m_min[1]!=null ? Math.round(wx.daily.temperature_2m_min[1]) : null,
      precipProb: wx.daily && wx.daily.precipitation_probability_max ? wx.daily.precipitation_probability_max[0] : null,
      uvMax: wx.daily && wx.daily.uv_index_max ? Math.round(wx.daily.uv_index_max[0]) : null,
      hourly,
      city: weatherLoc.label
    };
  }catch(e){
    state.weather = {status:'error'};
  }
  safeRender();
}
function weatherCond(code, isDay){
  if(code===0) return isDay ? 'clear-day' : 'clear-night';
  if([1,2].includes(code)) return isDay ? 'partly-day' : 'partly-night';
  if(code===3) return 'cloudy';
  if([45,48].includes(code)) return 'fog';
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)) return 'rain';
  if([71,73,75,77,85,86].includes(code)) return 'snow';
  if([95,96,99].includes(code)) return 'storm';
  return isDay ? 'clear-day' : 'clear-night';
}
function weatherDesc(code){
  if(code===0) return 'Céu limpo';
  if([1,2].includes(code)) return 'Parcialmente nublado';
  if(code===3) return 'Nublado';
  if([45,48].includes(code)) return 'Neblina';
  if([51,53,55,56,57].includes(code)) return 'Garoa';
  if([66,67].includes(code)) return 'Chuva congelante';
  if([61,63,65,80,81,82].includes(code)) return 'Chuva';
  if([71,73,75,77,85,86].includes(code)) return 'Neve';
  if([95,96,99].includes(code)) return 'Tempestade';
  return 'Tempo instável';
}

function renderWeatherWidget(){
  const w = state.weather;
  if(!w || w.status==='loading'){
    return `<div class="weather-widget" data-cond="loading"><span class="weather-loading">⏳ Carregando o clima…</span></div>`;
  }
  if(w.status==='error'){
    return `<button data-retry-weather class="weather-widget weather-widget-btn" data-cond="cloudy">
      <span class="weather-loading">🔄 Não deu pra buscar o clima agora — toque para tentar de novo</span>
    </button>`;
  }
  const cond = weatherCond(w.code, w.isDay);
  const desc = weatherDesc(w.code);
  const hours = (w.hourly && w.hourly.length) ? w.hourly : [];
  const n = hours.length;
  const temps = hours.map(h=>h.temp);
  const tMin = temps.length ? Math.min(...temps) : 0;
  const tMax = temps.length ? Math.max(...temps) : 1;
  const span = Math.max(1, tMax - tMin);
  const points = hours.map((h,i)=>{
    const x = n>1 ? (i/(n-1))*100 : 50;
    const y = 27 - ((h.temp - tMin)/span)*22;
    return {x, y, ...h};
  });
  const polyline = points.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
  const minMax = (w.tempMax!=null && w.tempMin!=null) ? `<span class="weather-minmax">↑${w.tempMax}°&nbsp;&nbsp;↓${w.tempMin}°</span>` : '';

  return `<div class="weather-widget" data-cond="${cond}">

}

function fmtRelativeSync(ts){
  if(!ts) return null;
  const diffSec = Math.max(0, Math.round((Date.now()-ts)/1000));
  if(diffSec<45) return 'agora mesmo';
  const diffMin = Math.round(diffSec/60);
  if(diffMin<60) return `há ${diffMin} min`;
  const diffH = Math.round(diffMin/60);
  return `há ${diffH}h`;
}

function countEventsToday(){
  const d = state.data;
  const today = new Date(); today.setHours(0,0,0,0);
  let count = 0;
  d.agenda.events.forEach(ev=>{
    const occ = nextOccurrence(ev);
    const durationDays = ev.endDate ? Math.max(0, daysDiff(ev.endDate, ev.date)) : 0;
    const occEnd = new Date(occ); occEnd.setDate(occEnd.getDate()+durationDays);
    if(occ<=today && today<=occEnd) count++;
  });
  return count;
}
function computeHomeCounts(){
  const d = state.data;
  const isPausedItem = i => { const entry = d.shopping.stock[i.name]; return !!(entry && entry.active===false); };
  const compras = Object.values(d.shopping.lists).reduce((s,items)=> s + items.filter(i=>!i.comprado && !isPausedItem(i)).length, 0);
  const undoneMsgs = d.messages.messages.filter(m=>!m.done);
  const urgent = undoneMsgs.filter(m=>m.priority==='urgente').length;
  const msgsHoje = undoneMsgs.filter(m=>m.priority==='hoje').length;
  const agendaHoje = countEventsToday();
  const hoje = msgsHoje + agendaHoje;
  const pendingTasks = d.home.tasks.filter(t=>!t.done);
  const atrasado = pendingTasks.filter(t=>t.dueDate && daysDiff(t.dueDate, new Date())<0).length;
  const projetosAtivos = d.projects.projects.filter(p=>!p.archived && p.status!=='concluido').length;
  // O número do badge de cada aba acompanha a cor: quando há algo urgente/hoje/atrasado,
  // o badge mostra só essa contagem (não o total) — assim o vermelho nunca "mente" sobre
  // quantos itens realmente precisam de atenção agora. Sem nada urgente, mostra o total (neutro).
  const recadosUrgentCount = urgent + msgsHoje;
  return {
    urgent, hoje, atrasado, compras, projetos: projetosAtivos,
    recados: recadosUrgentCount>0 ? recadosUrgentCount : undoneMsgs.length, recadosUrgent: recadosUrgentCount > 0,
    agenda: agendaHoje, agendaUrgent: agendaHoje > 0,
    casa: atrasado>0 ? atrasado : pendingTasks.length, casaUrgent: atrasado > 0,
  };
}

function migrateStock(){
  if(!state.data.shopping.lists.outras) state.data.shopping.lists.outras = [];
  if(!state.data.shopping.weeklyPlanExtras) state.data.shopping.weeklyPlanExtras = {};
  const stock = state.data.shopping.stock;
  Object.keys(stock).forEach(name=>{
    if(typeof stock[name] === 'string'){
      stock[name] = {status:stock[name], category:'mercado'};
    }
    const e = stock[name];
    if(e.active===undefined) e.active = true;
    if(e.expiryDate===undefined) e.expiryDate = null;
    if(e.availabilitySince===undefined) e.availabilitySince = todayISO();
    if(!Array.isArray(e.durations)) e.durations = [];
    if(e.qty===undefined) e.qty = e.status==='acabou'?0:(e.status==='pouco'?1:2);
    if(e.unit===undefined) e.unit = '';
    if(e.minQty===undefined) e.minQty = 1;
    if(e.purchaseLocation===undefined) e.purchaseLocation = '';
    if(e.description===undefined) e.description = '';
    e.status = stockStatusFromQty(e.qty, e.minQty);
  });
  if(!Array.isArray(state.data.shopping.purchases)) state.data.shopping.purchases = [];
  if(!state.data.shopping.historyMigrated){
    (state.data.shopping.history||[]).forEach(h=>{
      (h.items||[]).forEach(it=>{
        state.data.shopping.purchases.push({
          id: uid(), name: it.name, qty: it.qty||1,
          price: state.data.shopping.prices[it.name.toLowerCase()]||0,
          category: h.list, date: h.date
        });
      });
    });
    state.data.shopping.historyMigrated = true;
  }
  Object.values(state.data.shopping.lists).forEach(arr=>arr.forEach(i=>{
    if(i.loggedPurchaseId===undefined) i.loggedPurchaseId = null;
    if(i.location===undefined) i.location = null;
  }));
}

const SYNC_MIN_INTERVAL = 8000; // não repete a sincronização em segundo plano com menos de 8s de intervalo
async function backgroundSync(){
  if(!sheetsConfig.enabled || !sheetsConfig.url) return;
  if(syncInFlight) return;
  if(Date.now() - lastSyncAt < SYNC_MIN_INTERVAL) return;
  // não interrompe se a pessoa estiver digitando em algum campo
  const active = document.activeElement;
  if(active && ['INPUT','TEXTAREA','SELECT'].includes(active.tagName)) return;
  syncInFlight = true;
  lastSyncAt = Date.now();
  const before = JSON.stringify(state.data);
  await syncNow();
  syncInFlight = false;
  // só re-renderiza (e "pisca" a tela) se algo realmente mudou
  const active2 = document.activeElement;
  const stillFree = !active2 || !['INPUT','TEXTAREA','SELECT'].includes(active2.tagName);
  if(stillFree && JSON.stringify(state.data) !== before) render();
}

// ---------- MOTOR DE CONTEXTO (Alertas Inteligentes) ----------
// Dica de ação por tipo de evento da agenda — usada quando o evento é hoje ou amanhã.
const EVENT_TYPE_TIPS = {
  crianca: {icon:'🎒', text:'preparar a mochila'},
  aniversario: {icon:'🎁', text:'comprar o presente'},
  consulta: {icon:'📄', text:'separar os documentos'},
  vacina: {icon:'💉', text:'levar a carteira de vacinação'},
  viagem: {icon:'🧳', text:'planejar o passeio e arrumar a mala'},
  conta: {icon:'💳', text:'pagar a conta antes do vencimento'},
};
// Regra do rodízio municipal de São Paulo: dia da semana (1=seg...5=sex) -> finais de placa restritos.
const RODIZIO_DIGITS = {1:[1,2], 2:[3,4], 3:[5,6], 4:[7,8], 5:[9,0]};
function generateSmartTips(){
  const tips = [];
  const w = state.weather;
  if(w && w.status==='ok'){
    if(w.precipProb!=null && w.precipProb>=70) tips.push(`☔ Chance alta de chuva hoje (${w.precipProb}%) — leve guarda-chuva.`);
    if([95,96,99].includes(w.code)) tips.push(`⚠️ Tempestade prevista — evite sair de casa se não for necessário.`);
    if(w.tempMin!=null && w.tempMin<16) tips.push(`🧥 Vai esfriar (mínima de ${w.tempMin}°C) — leve um casaco.`);
    if(w.tempMax!=null && w.tempMax>32) tips.push(`🥤 Calor forte hoje (máxima de ${w.tempMax}°C) — hidrate-se bem.`);
    if(w.uvMax!=null && w.uvMax>=6) tips.push(`🧴 Índice UV alto hoje (${w.uvMax}) — passe protetor solar.`);
    if(w.humidity!=null && w.humidity<30) tips.push(`💧 Umidade baixa hoje (${w.humidity}%) — beba bastante água.`);
    if(w.windSpeed!=null && w.windSpeed>40) tips.push(`🪟 Vento forte previsto (~${w.windSpeed} km/h) — feche as janelas.`);
    if(w.tempMin!=null && w.tempMinTomorrow!=null && (w.tempMin - w.tempMinTomorrow)>=4){
      tips.push(`👕 Frente fria chegando (mínima cai para ${w.tempMinTomorrow}°C amanhã) — separe roupa mais quente.`);
    }
  }
  const plateDigit = state.data.home && state.data.home.carPlateDigit;
  if(plateDigit!==null && plateDigit!==undefined){
    const day = new Date().getDay();
    const restricted = RODIZIO_DIGITS[day];
    if(restricted && restricted.includes(Number(plateDigit))){
      tips.push(`🚗 Hoje é rodízio para o seu carro (final ${plateDigit}) — evite usar ou organize outro transporte.`);
    }
  }
  const d = state.data;
  d.agenda.events.forEach(ev=>{
    const tipInfo = EVENT_TYPE_TIPS[ev.type];
    if(!tipInfo) return;
    const occ = nextOccurrence(ev);
    const diff = daysDiff(occ, new Date());
    if(diff===0) tips.push(`${tipInfo.icon} ${ev.title} é hoje — ${tipInfo.text}.`);
    else if(diff===1) tips.push(`${tipInfo.icon} ${ev.title} é amanhã — ${tipInfo.text}.`);
  });
  return tips;
}
function computeAlerts(){
  const alerts = [];
  const d = state.data;
  // stock acabou
  Object.entries(d.shopping.stock||{}).forEach(([name, entry])=>{
    if(entry.status==='acabou' && entry.active!==false){
      const key = 'stock:'+name;
      if(state.dismissedAlerts[key]) return;
      const already = Object.values(d.shopping.lists).flat().some(i=>i.name.toLowerCase()===name.toLowerCase() && !i.comprado);
      if(!already){
        alerts.push({key, type:'stock', group:'compras', icon:'🛒', text:`${name} acabou na última compra.`, itemName:name, category:entry.category||'mercado'});
      }
    }
  });
  // agenda tomorrow / today
  d.agenda.events.forEach(ev=>{
    const occ = nextOccurrence(ev);
    const diff = daysDiff(occ, new Date());
    const key = 'ev:'+ev.id+':'+occ.toDateString();
    if(state.dismissedAlerts[key]) return;
    const icon = EVENT_TYPES[ev.type]?.icon || '📌';
    if(diff===0){
      alerts.push({key, type:'info', group:'agenda', icon, text:`${ev.title} é hoje${ev.time? ' às '+ev.time:''}.`});
    } else if(diff===1){
      alerts.push({key, type:'info', group:'agenda', icon, text:`${ev.title} é amanhã${ev.time? ' às '+ev.time:''}.`});
    }
  });
  // overdue home tasks
  const overdue = d.home.tasks.filter(t=>!t.done && t.dueDate && daysDiff(t.dueDate, new Date())<0);
  if(overdue.length && !state.dismissedAlerts['overdue']){
    alerts.push({key:'overdue', type:'info', group:'casa', icon:'🏠', text:`Você tem ${overdue.length} tarefa(s) da casa atrasada(s).`});
  }
  return alerts;
}
function dismissAlert(key){ state.dismissedAlerts[key]=true; render(); }
function getAvisosItems(){
  const alerts = computeAlerts();
  const tips = generateSmartTips();
  const groups = {casa:[], agenda:[], compras:[], dicas:[]};
  alerts.forEach(a=>{
    (groups[a.group] || groups.agenda).push({icon:a.icon, text:a.text, key:a.key, stockAction: a.type==='stock' ? {name:a.itemName, cat:a.category} : null});
  });
  tips.forEach(t=> groups.dicas.push({icon:'💡', text:t, key:null, stockAction:null}));

  const GROUP_META = [
    ['casa','Atenção'], ['agenda','Hoje e amanhã'], ['compras','Estoque'], ['dicas','Dicas do dia']
  ];
  const allItems = [];
  GROUP_META.forEach(([gk,label])=>{ groups[gk].forEach(it=> allItems.push({...it, groupLabel:label})); });
  return allItems;
}

      <span class="aviso-text">${escapeHtml(it.text)}${it.stockAction? ` <button class="link" data-add-stock="${escapeHtml(it.stockAction.name)}" data-add-stock-cat="${it.stockAction.cat}">Adicionar à lista</button>`:''}</span>
      ${it.key? `<button class="icon-btn" data-dismiss="${it.key}" title="Dispensar" style="flex:0 0 auto">×</button>` : ''}
    </div>`;
  }).join('') : `<div class="empty" style="padding:18px 2px;text-align:center">Nenhum aviso por aqui. 🎉</div>`;

  return `
  <div class="avisos-backdrop" data-close-avisos></div>

      <span>🔔 Avisos${allItems.length? ` (${allItems.length})` : ''}</span>

    </div>
    <div class="avisos-panel-body">${rowsHtml}</div>
  </div>`;
}
async function addStockToList(name, category){
  const list = LIST_META[category] ? category : 'mercado';
  state.data.shopping.lists[list].push({id:uid(), name, qty:1, comprado:false, loggedPurchaseId:null, location:null});
  await saveKey('shopping');
  state.dismissedAlerts['stock:'+name]=true;
  render();
}

// ---------- INÍCIO ----------
function renderInicio(){
  const d = state.data;
  const upcomingEvents = d.agenda.events
    .map(ev=>{
      const occ = nextOccurrence(ev);
      // eventos de vários dias (com data final) só saem da tela inicial depois que o último dia termina
      const durationDays = ev.endDate ? Math.max(0, daysDiff(ev.endDate, ev.date)) : 0;
      const occEnd = new Date(occ); occEnd.setDate(occEnd.getDate()+durationDays);
      return {ev, occ, occEnd};
    })
    .sort((a,b)=>a.occ-b.occ);
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  // só mostra compromissos que ainda não terminaram — passa o dia (ou o último dia, se for de vários dias), some da tela inicial
  const nextCompromissos = upcomingEvents.filter(x=>x.occEnd>=todayStart).slice(0,8);
  const events14 = upcomingEvents.filter(x=>x.ev.type==='evento' && x.occEnd>=todayStart && daysDiff(x.occ,new Date())<=14).slice(0,5);

  const urgentMsgs = d.messages.messages.filter(m=>!m.done).sort((a,b)=>prioRank(a.priority)-prioRank(b.priority)).slice(0,4);
  const pendingTasks = d.home.tasks.filter(t=>!t.done).slice(0,4);
  // Itens cujo produto está pausado (inativo) no estoque não entram nas previsões (mesma regra da aba Compras).
  const isPausedItem = i => { const entry = d.shopping.stock[i.name]; return !!(entry && entry.active===false); };
  const shoppingCounts = Object.entries(d.shopping.lists).map(([k,items])=>({k,pending:items.filter(i=>!i.comprado && !isPausedItem(i)).length}));
  const totalPending = shoppingCounts.reduce((s,c)=>s+c.pending,0);
  const shoppingPreview = Object.entries(d.shopping.lists)
    .flatMap(([listKey,items])=> items.filter(i=>!i.comprado && !isPausedItem(i)).map(i=>({...i, listKey})));
  const todayDow = new Date().getDay();
  const todayPlan = WEEKLY_SHOPPING_PLAN[todayDow];
  const todayPlanExtras = (d.shopping.weeklyPlanExtras || {})[todayDow] || [];
  // lista resumida: só os itens que batem com as indicações do plano de hoje (quando o dia tem um foco definido)
  const todayShoppingPreview = todayPlan.keywords
    ? shoppingPreview.filter(i=>itemMatchesPlanKeywords(i.name, todayPlan.keywords))
    : shoppingPreview;
  const priceOf = i => (parseFloat(d.shopping.prices[i.name.toLowerCase()])||0)*(i.qty||1);
  const filteredTotalPrice = todayShoppingPreview.reduce((s,i)=>s+priceOf(i),0);
  const fullTotalPrice = shoppingPreview.reduce((s,i)=>s+priceOf(i),0);

  return `
    <div class="card" style="margin-bottom:14px">
      <div class="section-title">📦 Notificações de Correios</div>

          <div class="empty">${escapeHtml(state.mailEmails.message||'Não foi possível carregar.')}</div>

        ` : (()=>{

            .filter(it=>!receivedIds.has(it.threadId))
            .slice().sort((a,b)=> new Date(b.date) - new Date(a.date))
            .slice(0,8);
          return pending.length ? pending.map(it=>{
            const borderColor = it.unread ? 'var(--primary)' : 'var(--border)';
            const sender = getDisplaySenderName(it);
            const line = formatCorreiosLine(sender, it.subject, extractReceivedInfo(it));
            const brand = getBrandVisual(sender);
            return `
            <div class="shop-item" style="border-left-color:${borderColor};padding:10px 12px">
              <span class="chk" data-toggle-condo="${escapeHtml(it.threadId)}" title="Marcar como já recebido" style="margin-top:2px"></span>
              <span title="${escapeHtml(sender)}" style="flex:0 0 auto;width:26px;height:26px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:${brand.bg};color:${brand.fg};font-size:15px">${brand.logo? `<img src="${brand.logo}" alt="${escapeHtml(sender)}" style="width:100%;height:100%;object-fit:cover">` : brand.emoji}</span>
              <div class="shop-item-main">
                ${it.unread? `<div style="margin-bottom:2px"><span class="contact-role" style="color:var(--primary);font-weight:700">NOVO</span></div>`:''}
                <div class="item-name" style="font-weight:600;font-size:13px">${escapeHtml(line)}</div>
                ${it.trackingCode? `<div class="contact-role" style="margin-top:3px">Rastreio: ${escapeHtml(it.trackingCode)}</div>`:''}

const PHASE_ORDER = ['ideia','planejamento','andamento','concluido'];
const PHASE_LABELS = {ideia:'Ideia', planejamento:'Planejamento', andamento:'Em andamento', concluido:'Concluído'};
function renderPhaseStepper(status){
  const effective = status==='pausado' ? 'andamento' : status;
  const idx = PHASE_ORDER.indexOf(effective);
  return `
    <div style="display:flex;align-items:center;gap:2px;flex:1;min-width:180px">
      ${PHASE_ORDER.map((ph,i)=>`
        <div style="display:flex;align-items:center;flex:${i<PHASE_ORDER.length-1?'1':'0'}">
          <div style="display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0">
            <div style="width:11px;height:11px;border-radius:50%;flex:0 0 auto;
              background:${i<=idx? (status==='pausado' && i===idx ? 'var(--secondary)' : 'var(--primary)') : 'var(--border)'};
              ${i===idx && status==='pausado' ? 'box-shadow:0 0 0 3px var(--secondary-tint);' : (i===idx?'box-shadow:0 0 0 3px var(--primary-tint);':'')}
            "></div>
            <span style="font-size:9.5px;color:${i<=idx?'var(--ink-soft)':'var(--ink-faint)'};font-weight:${i===idx?'700':'500'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:64px">${PHASE_LABELS[ph]}</span>
          </div>
          ${i<PHASE_ORDER.length-1? `<div style="height:2px;flex:1;background:${i<idx?'var(--primary)':'var(--border)'};margin:0 2px 14px"></div>` : ''}
        </div>
      `).join('')}
    </div>
  `;
}
function renderProjectsProgressCard(){
  const projects = state.data.projects.projects;
  if(!projects.length) return '';
  const active = projects.filter(p=>p.status!=='concluido');
  const list = active.length ? active : projects.slice(0,3);
  return `

        ${list.map(p=>{
